    restore_value: no
  - id: next_sleep_ms
    type: int
    initial_value: "3600000"

  # Keep the screen refresh count down: the first battery reading may trigger one
  # extra refresh after boot; later ADC samples update HA only, not the e-paper.
  - id: battery_ui_refreshed
    type: bool
    initial_value: "false"
    restore_value: no

  - id: finish_card_dismissed
    type: bool
    initial_value: "false"
    restore_value: no

  # Stable visual order for the current awake session. Recomputed only at boot/wakeup,
  # so checking/unchecking tasks does not move rows while the user is interacting.
  - id: display_order_0
    type: int
    initial_value: "0"
    restore_value: no
  - id: display_order_1
    type: int
    initial_value: "1"
    restore_value: no
  - id: display_order_2
    type: int
    initial_value: "2"
    restore_value: no
  - id: display_order_3
    type: int
    initial_value: "3"
    restore_value: no
  - id: display_order_4
    type: int
    initial_value: "4"
    restore_value: no

script:
  - id: scheduled_sleep_cycle
    mode: restart
    then:
      # Restarted on every interaction. Start before display refresh so total awake time
      # is about 15s from the last event, including the synchronous ePaper refresh.
      - delay: ${awake_timeout}
      - lambda: |- 
          auto now = id(rtc_time).now();
          if (!now.is_valid()) {
            // Fallback if RTC has no valid time: retry after 10 minutes.
            id(next_sleep_ms) = 10 * 60 * 1000;
            ESP_LOGW("sleep", "RTC time invalid; fallback sleep is 10 minutes");
            return;
          }
          const int now_s = now.hour * 3600 + now.minute * 60 + now.second;
          int target_s = 24 * 3600 + id(wake_hour_0) * 3600 + id(wake_minute_0) * 60;
          const int wake_s[3] = {
            id(wake_hour_0) * 3600 + id(wake_minute_0) * 60,
            id(wake_hour_1) * 3600 + id(wake_minute_1) * 60,
            id(wake_hour_2) * 3600 + id(wake_minute_2) * 60
          };
          for (int i = 0; i < 3; i++) if (wake_s[i] > now_s && wake_s[i] < target_s) target_s = wake_s[i];
          int seconds = target_s - now_s;
          if (seconds < 30) seconds = 30;
          id(next_sleep_ms) = seconds * 1000;
          ESP_LOGI("sleep", "RTC time %02d:%02d:%02d; next scheduled wake in %d seconds", now.hour, now.minute, now.second, seconds);
      - mqtt.publish:
          topic: todo_3310/state/seconds_to_wakeup
          payload: !lambda 'return std::to_string(id(next_sleep_ms) / 1000);'
          retain: true
      - deep_sleep.enter:
          sleep_duration: !lambda "return id(next_sleep_ms);"

# Include printable ASCII plus German umlauts and euro; glyphs is an explicit character set here.
font:
