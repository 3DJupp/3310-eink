substitutions:
  name: "coreink_dev"
  hostname: coreink-todo
  friendly_name: "todo_3310"
  manufacturer: M5Stack
  model: CoreInk
  timezone: Europe/Berlin
  # Device UI language until Home Assistant sends one: de or en.
  ui_language: de
  coreink_buzzer_pin: GPIO2
  coreink_led_pin: GPIO10
  coreink_battery_pin: GPIO35
  coreink_pwr_mos_pin: GPIO12
  battery_divider: "4.90"
  awake_timeout: 15s
  # Once the last open task is checked: show the finish card, keep it this long
  # (time for TOP: UNDO) and then go to sleep instead of waiting for awake_timeout.
  done_awake_timeout: 5s
  # Buzzer sounds (RTTTL) and volume. wake: SIDE press or cold boot, done: list finished.
  beep_wake: "wake:d=8,o=6,b=200:c"
  beep_done: "done:d=16,o=6,b=180:c,e,g,8c7"
  buzzer_gain: 30%
  # Wake a little after each daypart start so a slightly slow RTC still lands in the new daypart.
  wake_margin_s: "20"
  coreink_btn:
    stick:
      up:
        number: GPIO37
        inverted: true
        other_uses: false
      press:
        number: GPIO38
        inverted: true
        other_uses: false
      down:
        number: GPIO39
        inverted: true
        other_uses: false
    top:
      number: GPIO5
      inverted: true
      other_uses: false
    side:
      number: GPIO27
      inverted: true
      other_uses: true
  epaper:
    type: 1.54inv2
    rotation: 0
    cs: GPIO9
    dc: GPIO15
    busy:
      pin: GPIO4
      inverted: false
    reset: GPIO0
    full_update_every: 6

esphome:
  name: ${hostname}
  friendly_name: ${friendly_name}
  comment: "todo_3310 - Home Assistant/MQTT checklist with one task list per daypart"
  platformio_options:
    upload_speed: 1500000
  on_boot:
    # Restore the CoreInk power-hold pin before releasing its deep-sleep hold.
    - priority: 900
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_12, 1);
            gpio_hold_dis(GPIO_NUM_12);
            gpio_deep_sleep_hold_dis();
    # On battery the board sleeps fully powered off and the BM8563 alarm switches it
    # back on, so the ESP32 sees a plain cold boot. The RTC alarm flag (AF, register
    # 0x01 bit 3) tells an alarm boot apart from a SIDE button or USB boot. Always
    # clear AF/TF and disable AIE/TIE here: while AF is set the open-drain INT line
    # holds the power latch on and the next power-off would not work.
    - priority: 500
      then:
        - lambda: |-
            id(rtc_alarm_wake) = false;
            uint8_t reg = 0x01;
            uint8_t status = 0;
            const auto err = id(bus_int)->write_readv(0x51, &reg, 1, &status, 1);
            if (err != i2c::ERROR_OK) {
              ESP_LOGW("wake", "BM8563 status read failed (i2c error %d)", (int) err);
            } else {
              ESP_LOGI("wake", "BM8563 status 0x%02X: AF=%d TF=%d AIE=%d", status, (status >> 3) & 1, (status >> 2) & 1, (status >> 1) & 1);
              if (status & 0x0F) {
                const uint8_t clear[2] = {0x01, 0x00};
                if (id(bus_int)->write(0x51, clear, sizeof(clear)) != i2c::ERROR_OK) ESP_LOGW("wake", "BM8563 status clear failed");
              }
              id(rtc_alarm_wake) = (status & 0x08) && esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;
            }
            if (id(rtc_alarm_wake)) {
              ESP_LOGI("wake", "Wake reason: BM8563 RTC alarm (cold boot from power-off)");
              return;
            }
            const auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              ESP_LOGI("wake", "Wake reason: scheduled timer (daypart start)");
            } else if (cause == ESP_SLEEP_WAKEUP_EXT0) {
              ESP_LOGI("wake", "Wake reason: SIDE button on ${coreink_btn.side.number} (EXT0)");
            } else if (cause == ESP_SLEEP_WAKEUP_EXT1) {
              ESP_LOGI("wake", "Wake reason: GPIO EXT1; check wake pin mask");
              const uint64_t mask = esp_sleep_get_ext1_wakeup_status();
              ESP_LOGI("wake", "EXT1 wake pin mask: 0x%llx", (unsigned long long) mask);
            } else if (cause == ESP_SLEEP_WAKEUP_UNDEFINED) {
              ESP_LOGI("wake", "Wake reason: cold boot (SIDE button from power-off, USB, reset or flash)");
            } else {
              ESP_LOGI("wake", "Wake reason: ESP-IDF code %d", (int) cause);
            }
        # The ESP32's own clock drifts a lot during deep sleep; take the time from the
        # PCF8563 before deciding which daypart is active. This runs before MQTT connects,
        # so the state reported on connect already includes the daypart reset.
        - pcf8563.read_time: rtc_time
        # Calibrate the sleep timer and catch early timer wakes. Runs before Wi-Fi, MQTT
        # and the display start, so an early wake costs only a second of CPU time.
        - lambda: |-
            const uint32_t start = id(sleep_start_epoch);
            const uint32_t target = id(sleep_target_epoch);
            const uint32_t timer_ms = id(sleep_timer_ms);
            id(sleep_start_epoch) = 0;  // one measurement per sleep
            auto now = id(rtc_time).now();
            if (esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_TIMER || !now.is_valid() || start == 0 || target <= start) return;
            const int64_t actual_s = (int64_t) now.timestamp - start;
            // Short sleeps are too coarse for the RTC's 1 s resolution.
            if (timer_ms >= 30UL * 60 * 1000 && actual_s > 0) {
              const float measured = (timer_ms / 1000.0f) / actual_s;
              if (measured > 0.85f && measured < 1.2f) {
                // First measurement after a power loss replaces the default, later ones are smoothed.
                const float old_scale = id(sleep_timer_scale);
                id(sleep_timer_scale) = old_scale == 1.0f ? measured : 0.5f * old_scale + 0.5f * measured;
                ESP_LOGI("sleep", "Timer slept %.0f s for %lld real s; scale %.4f -> %.4f", timer_ms / 1000.0f, (long long) actual_s, old_scale, id(sleep_timer_scale));
              } else {
                ESP_LOGW("sleep", "Ignoring implausible timer ratio %.4f", measured);
              }
            }
            // The planned wake is ${wake_margin_s} s after a daypart start. Woken before that
            // start: sleep again for the rest without Wi-Fi, MQTT or a display refresh.
            const int64_t remaining_s = (int64_t) target - now.timestamp;
            if (remaining_s <= ${wake_margin_s}) return;
            const uint32_t ms = (uint32_t) (remaining_s * 1000.0f * id(sleep_timer_scale));
            ESP_LOGI("sleep", "Timer woke %lld s early; sleeping again for %u ms", (long long) (remaining_s - ${wake_margin_s}), (unsigned) ms);
            id(sleep_start_epoch) = now.timestamp;
            id(sleep_timer_ms) = ms;
            // Store the globals now: the usual shutdown hooks would touch Wi-Fi, MQTT and the
            // display, which are not set up yet.
            sleep_timer_scale->update();
            sleep_start_epoch->update();
            sleep_timer_ms->update();
            global_preferences->sync();
            // Same wake setup as the deep_sleep component: SIDE button (GPIO27, active LOW)
            // or the timer, with the power-hold pin kept high.
            gpio_hold_en(GPIO_NUM_12);
            gpio_sleep_set_direction(GPIO_NUM_27, GPIO_MODE_INPUT);
            gpio_hold_en(GPIO_NUM_27);
            gpio_deep_sleep_hold_en();
            esp_sleep_enable_ext0_wakeup(GPIO_NUM_27, 0);
            esp_sleep_enable_timer_wakeup((uint64_t) ms * 1000ULL);
            esp_deep_sleep_start();
        - script.execute: refresh_view
    - priority: -100
      then:
        - delay: 2s
        # Scheduled wakes (RTC alarm or ESP32 timer) stay silent. A SIDE press beeps,
        # both from deep sleep (EXT0) and from full power-off (cold boot without AF).
        # A USB plug-in, reset or flash also counts as a cold boot and beeps once.
        - if:
            condition:
              lambda: |-
                const auto cause = esp_sleep_get_wakeup_cause();
                return cause == ESP_SLEEP_WAKEUP_EXT0 || (cause == ESP_SLEEP_WAKEUP_UNDEFINED && !id(rtc_alarm_wake));
            then:
              - logger.log: "Wake beep: SIDE / cold boot"
              - rtttl.play: "${beep_wake}"
        # Start the short awake window before the ePaper update (which is synchronous).
        - script.execute: scheduled_sleep_cycle
        # Draw once the first battery reading exists, so the boot image needs no second
        # (partial) refresh just for the battery value.
        - wait_until:
            condition:
              lambda: return id(battery_percent).has_state();
            timeout: 3s
        - component.update: todo_display

esp32:
  board: m5stack-coreink
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true
      flash_chip: gd

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s
  # A static IP skips DHCP on every wake, which shortens each wake and saves battery.
  # Remove the manual_ip block to fall back to DHCP.
  manual_ip:
    static_ip: !secret todo_3310_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
    dns1: !secret wifi_dns

# MQTT carries the retained Home Assistant configuration and the checklist state.
# Topics (slot = daypart 0..2):
#   todo_3310/config               retained JSON from HA: titles, times, messages, task labels
#   todo_3310/command/slot/<slot>  retained JSON from HA after a change in the HA to-do list;
#                                  the device applies it once and clears the retained message
#   todo_3310/state/slot/<slot>    JSON from the device after every local change and on connect
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: todo_3310/device
  birth_message:
    topic: todo_3310/state/availability
    payload: online
    retain: true
  will_message:
    topic: todo_3310/state/availability
    payload: offline
    retain: true
  on_connect:
    then:
      - mqtt.publish:
          topic: todo_3310/state/availability
          payload: online
          retain: true
      - script.execute: publish_status
      - mqtt.publish:
          topic: todo_3310/state/active_slot
          payload: !lambda 'return std::to_string(id(active_slot));'
          retain: true
      - script.execute:
          id: publish_slot_state
          slot: 0
      - script.execute:
          id: publish_slot_state
          slot: 1
      - script.execute:
          id: publish_slot_state
          slot: 2
  on_message:
    - topic: todo_3310/config
      then:
        - lambda: |-
            id(config_changed) = false;
            json::parse_json(x, [](JsonObject root) -> bool {
              JsonArray slots = root["slots"].as<JsonArray>();
              if (slots.isNull()) {
                ESP_LOGW("ha_sync", "Config without \"slots\" ignored (expected config version 2)");
                return false;
              }
              std::string *labels[3] = {&id(slot_labels_0), &id(slot_labels_1), &id(slot_labels_2)};
              std::string *titles[3] = {&id(slot_title_0), &id(slot_title_1), &id(slot_title_2)};
              std::string *messages[3] = {&id(wake_message_0), &id(wake_message_1), &id(wake_message_2)};
              bool changed = false;
              for (int s = 0; s < 3 && s < (int) slots.size(); s++) {
                JsonObject slot = slots[s].as<JsonObject>();
                // Up to five non-empty labels, stored newline-separated so they survive deep sleep.
                std::vector<std::string> next;
                std::string joined;
                JsonArray tasks = slot["tasks"].as<JsonArray>();
                for (JsonVariant task : tasks) {
                  if (next.size() == 5) break;
                  std::string label = task.as<std::string>();
                  std::replace(label.begin(), label.end(), '\n', ' ');
                  if (label.empty()) continue;
                  if (!joined.empty()) joined += '\n';
                  joined += label;
                  next.push_back(label);
                }
                if (joined != *labels[s]) {
                  // Keep done states by label name so renaming or reordering in HA does not
                  // move a check mark to a different task.
                  const std::vector<std::string> &prev = id(slot_tasks)[s];
                  int remapped = 0;
                  for (size_t n = 0; n < next.size(); n++) {
                    for (size_t p = 0; p < prev.size(); p++) {
                      if (prev[p] == next[n] && (id(slot_done)[s] & (1 << p))) remapped |= 1 << n;
                    }
                  }
                  id(slot_done)[s] = remapped;
                  *labels[s] = joined;
                  id(slot_tasks)[s] = next;
                  changed = true;
                }
                if (slot["title"].is<const char *>() && *titles[s] != slot["title"].as<std::string>()) { *titles[s] = slot["title"].as<std::string>(); changed = true; }
                if (slot["message"].is<const char *>() && *messages[s] != slot["message"].as<std::string>()) { *messages[s] = slot["message"].as<std::string>(); changed = true; }
                if (slot["hour"].is<int>() && slot["minute"].is<int>()) {
                  const int h = slot["hour"].as<int>(), m = slot["minute"].as<int>();
                  if (h >= 0 && h < 24 && m >= 0 && m < 60 && (h != id(wake_hour)[s] || m != id(wake_minute)[s])) {
                    id(wake_hour)[s] = h;
                    id(wake_minute)[s] = m;
                    changed = true;
                  }
                }
              }
              if (root["language"].is<const char *>()) {
                const bool de = root["language"].as<std::string>() != "en";
                if (de != id(ui_de)) { id(ui_de) = de; changed = true; }
              }
              id(config_changed) = changed;
              ESP_LOGI("ha_sync", "Home Assistant config version %d %s", root["version"] | 0, changed ? "applied" : "unchanged");
              return true;
            });
        # Retained config is re-published regularly; only redraw the e-paper when something changed.
        - if:
            condition:
              lambda: return id(config_changed);
            then:
              - script.execute: refresh_view
              - component.update: todo_display
        - mqtt.publish:
            topic: todo_3310/state/config_applied
            payload: "true"
            retain: true
    - topic: todo_3310/command/slot/0
      then:
        - if:
            condition:
              lambda: return !x.empty();
            then:
              - script.execute:
                  id: apply_slot_command
                  slot: 0
                  payload: !lambda return x;
    - topic: todo_3310/command/slot/1
      then:
        - if:
            condition:
              lambda: return !x.empty();
            then:
              - script.execute:
                  id: apply_slot_command
                  slot: 1
                  payload: !lambda return x;
    - topic: todo_3310/command/slot/2
      then:
        - if:
            condition:
              lambda: return !x.empty();
            then:
              - script.execute:
                  id: apply_slot_command
                  slot: 2
                  payload: !lambda return x;

api:
  reboot_timeout: 0s
  encryption:
    key: !secret todo_3310_api_key

ota:
  - platform: esphome

safe_mode:
  boot_is_good_after: 15s
  num_attempts: 10

# Integrated CoreInk buzzer on GPIO2. RTTTL plays a brief wake chirp and a short
# finish jingle when the last open task of the current list is checked.
output:
  - platform: ledc
    pin: ${coreink_buzzer_pin}
    id: buzzer_output
    frequency: 1000Hz

rtttl:
  id: coreink_rtttl
  output: buzzer_output
  gain: ${buzzer_gain}

# Daily use: three dayparts (morning, midday, evening), each with its own task list.
# The device wakes at the start of every daypart; all lists reset once per day at the first one.
# The single wakeup pin is read from the central button definition: coreink_btn.side.
# UP/DOWN/PRESS stay list navigation/interaction while awake; multi-pin ANY_LOW is parked for now.
deep_sleep:
  id: deep_sleep_battery
  # Classic ESP32: use one active-LOW RTC GPIO. Pin and polarity come from coreink_btn.side.
  wakeup_pin:
    number: ${coreink_btn.side.number}
    inverted: ${coreink_btn.side.inverted}
    allow_other_uses: ${coreink_btn.side.other_uses}
  wakeup_pin_mode: KEEP_AWAKE

i2c:
  - id: bus_int
    sda: GPIO21
    scl: GPIO22

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO34

globals:
  # Per-daypart lists: index 0 = morning, 1 = midday, 2 = evening.
  # Done states are bit masks (bit i = task i of that daypart).
  - id: slot_done
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
    restore_value: yes
  # Local calendar day (YYYYMMDD) on which each daypart list was last reset (all at the
  # first daypart start of the day).
  - id: slot_reset_day
    type: std::array<int, 3>
    initial_value: "{-1, -1, -1}"
    restore_value: yes
  - id: wake_hour
    type: std::array<int, 3>
    initial_value: "{6, 12, 18}"
    restore_value: yes
  - id: wake_minute
    type: std::array<int, 3>
    initial_value: "{0, 0, 0}"
    restore_value: yes

  # Labels are runtime-configurable from Home Assistant over retained MQTT.
  # Each daypart keeps up to five labels, newline-separated.
  - id: slot_labels_0
    type: std::string
    initial_value: '"Z\u00E4hne putzen\nMedikamente nehmen\nAnziehen\nSchultasche packen"'
    restore_value: yes
    max_restore_data_length: 254
  - id: slot_labels_1
    type: std::string
    initial_value: '"Pflanzen gie\u00DFen\nPost holen\nW\u00E4sche aufh\u00E4ngen"'
    restore_value: yes
    max_restore_data_length: 254
  - id: slot_labels_2
    type: std::string
    initial_value: '"K\u00FCche aufr\u00E4umen\nZ\u00E4hne putzen\nLesen"'
    restore_value: yes
    max_restore_data_length: 254
  - id: slot_title_0
    type: std::string
    initial_value: '"Morgens"'
    restore_value: yes
  - id: slot_title_1
    type: std::string
    initial_value: '"Mittags"'
    restore_value: yes
  - id: slot_title_2
    type: std::string
    initial_value: '"Abends"'
    restore_value: yes
  # Shown on the finish card of the same daypart.
  - id: wake_message_0
    type: std::string
    initial_value: '"Sch\u00F6nen Tag!"'
    restore_value: yes
  - id: wake_message_1
    type: std::string
    initial_value: '"Sch\u00F6nen Nachmittag!"'
    restore_value: yes
  - id: wake_message_2
    type: std::string
    initial_value: '"Bis morgen!"'
    restore_value: yes

  # Device UI language (true = German), set by Home Assistant via the config message.
  - id: ui_de
    type: bool
    initial_value: 'std::string("${ui_language}") != "en"'
    restore_value: yes

  # Daypart shown on screen; restored so a boot without valid time keeps the last one.
  - id: active_slot
    type: int
    initial_value: "0"
    restore_value: yes

  # Parsed labels per daypart, rebuilt from slot_labels_* at boot and on config change.
  - id: slot_tasks
    type: std::array<std::vector<std::string>, 3>
    restore_value: no

  # Selection is a task index within the active daypart (-1 = empty list).
  - id: selected_task
    type: int
    initial_value: "0"
    restore_value: no

  # Undo only covers the most recent toggle of the current awake session, so a finished
  # list cannot be reopened with TOP after the next wakeup.
  - id: last_action_task
    type: int
    initial_value: "-1"
    restore_value: no

  - id: last_wakeup_daykey
    type: int
    initial_value: "-1"
    restore_value: yes

  - id: last_wakeup_hour
    type: int
    initial_value: "-1"
    restore_value: yes

  - id: last_wakeup_minute
    type: int
    initial_value: "-1"
    restore_value: yes

  - id: next_sleep_ms
    type: int
    initial_value: "3600000"

  # Deep-sleep timer calibration. The ESP32 sleep timer runs on an internal RC oscillator
  # that is a few percent fast, so a 6 h sleep ends several minutes early. After each
  # timer wake the firmware compares the PCF8563 time with the planned wake time and
  # learns how many timer seconds one real second takes (sleep_timer_scale).
  - id: sleep_timer_scale
    type: float
    initial_value: "1.0"
    restore_value: yes
  # RTC epoch at which the last sleep started and the wake it aimed for, plus the
  # duration handed to the timer. sleep_start_epoch = 0 means nothing to measure.
  - id: sleep_start_epoch
    type: uint32_t
    initial_value: "0"
    restore_value: yes
  - id: sleep_target_epoch
    type: uint32_t
    initial_value: "0"
    restore_value: yes
  - id: sleep_timer_ms
    type: uint32_t
    initial_value: "0"
    restore_value: yes

  # Set on boot when the BM8563 alarm flag was set on a cold boot, i.e. the RTC alarm
  # switched the board on from full power-off.
  - id: rtc_alarm_wake
    type: bool
    initial_value: "false"
    restore_value: no
  # True once the BM8563 alarm is programmed and read back for the next wake.
  - id: rtc_alarm_armed
    type: bool
    initial_value: "false"
    restore_value: no

  - id: config_changed
    type: bool
    initial_value: "false"
    restore_value: no

  # Set when the list was just finished; the next scheduled_sleep_cycle start uses
  # done_awake_timeout and resets it.
  - id: finish_requested
    type: bool
    initial_value: "false"
    restore_value: no
  - id: finish_sleep
    type: bool
    initial_value: "false"
    restore_value: no

  # True while drawing the image that stays on the panel during deep sleep.
  - id: going_to_sleep
    type: bool
    initial_value: "false"
    restore_value: no

  # Stable visual order for the current awake session. Recomputed only at boot/wakeup
  # and on config change, so checking tasks does not move rows while the user interacts.
  - id: display_order
    type: std::array<int, 5>
    initial_value: "{0, 1, 2, 3, 4}"
    restore_value: no

script:
  # Pick the active daypart from the RTC, reset all lists once per day, parse labels and
  # rebuild the row order: open tasks first, then completed ones, each in list order.
  - id: refresh_view
    mode: queued
    then:
      - lambda: |-
          const std::string *joined[3] = {&id(slot_labels_0), &id(slot_labels_1), &id(slot_labels_2)};
          for (int s = 0; s < 3; s++) {
            std::vector<std::string> tasks;
            size_t start = 0;
            while (start < joined[s]->size() && tasks.size() < 5) {
              size_t end = joined[s]->find('\n', start);
              if (end == std::string::npos) end = joined[s]->size();
              if (end > start) tasks.push_back(joined[s]->substr(start, end - start));
              start = end + 1;
            }
            id(slot_tasks)[s] = tasks;
          }

          auto now = id(rtc_time).now();
          if (now.is_valid()) {
            const int day_key = now.year * 10000 + now.month * 100 + now.day_of_month;
            id(last_wakeup_daykey) = day_key;
            id(last_wakeup_hour) = now.hour;
            id(last_wakeup_minute) = now.minute;
            // Active daypart = the one that started most recently. Before the first start
            // of the day, yesterday's latest daypart is still active.
            const int now_m = now.hour * 60 + now.minute;
            int active = -1, active_start = -1, latest = 0, latest_start = -1;
            for (int s = 0; s < 3; s++) {
              const int start_m = id(wake_hour)[s] * 60 + id(wake_minute)[s];
              if (start_m <= now_m && start_m > active_start) { active = s; active_start = start_m; }
              if (start_m > latest_start) { latest = s; latest_start = start_m; }
            }
            const bool started_today = active >= 0;
            if (!started_today) active = latest;
            // A new day starts with the first daypart: reset all three lists once, so
            // yesterday's evening ticks do not linger and tasks can be ticked ahead of
            // their daypart without being cleared when it starts.
            if (started_today) {
              for (int s = 0; s < 3; s++) {
                if (id(slot_reset_day)[s] == day_key) continue;
                id(slot_done)[s] = 0;
                id(slot_reset_day)[s] = day_key;
                ESP_LOGI("tasks", "Daypart %d list reset for %04d-%02d-%02d", s, now.year, now.month, now.day_of_month);
              }
            }
            id(active_slot) = active;
          } else {
            ESP_LOGW("wake", "RTC time invalid; keeping daypart %d, reset deferred", id(active_slot));
          }

          const int s = id(active_slot);
          const int count = id(slot_tasks)[s].size();
          const int mask = id(slot_done)[s];
          int pos = 0, first_open = -1;
          for (int i = 0; i < count; i++) if (!(mask & (1 << i))) { id(display_order)[pos++] = i; if (first_open < 0) first_open = i; }
          for (int i = 0; i < count; i++) if (mask & (1 << i)) id(display_order)[pos++] = i;
          id(selected_task) = count == 0 ? -1 : (first_open >= 0 ? first_open : id(display_order)[0]);
          id(last_action_task) = -1;

  # Report one daypart list as {"labels": [...], "done": [...]}; HA matches by label name.
  - id: publish_slot_state
    mode: queued
    parameters:
      slot: int
    then:
      - mqtt.publish:
          topic: !lambda 'return "todo_3310/state/slot/" + std::to_string(slot);'
          payload: !lambda |-
            return json::build_json([slot](JsonObject root) {
              JsonArray labels = root["labels"].to<JsonArray>();
              JsonArray done = root["done"].to<JsonArray>();
              const auto &tasks = id(slot_tasks)[slot];
              for (size_t i = 0; i < tasks.size(); i++) {
                labels.add(tasks[i]);
                done.add((id(slot_done)[slot] & (1 << i)) != 0);
              }
            });

  # Apply {"labels": [...], "done": [...]} from HA by label name, then clear the retained
  # command so an old command cannot undo a later daypart reset.
  - id: apply_slot_command
    mode: queued
    parameters:
      slot: int
      payload: string
    then:
      - lambda: |-
          json::parse_json(payload, [slot](JsonObject root) -> bool {
            JsonArray labels = root["labels"].as<JsonArray>();
            JsonArray done = root["done"].as<JsonArray>();
            if (labels.isNull() || done.isNull()) return false;
            const auto &tasks = id(slot_tasks)[slot];
            int mask = id(slot_done)[slot];
            for (size_t i = 0; i < labels.size() && i < done.size(); i++) {
              const std::string label = labels[i].as<std::string>();
              for (size_t t = 0; t < tasks.size(); t++) {
                if (tasks[t] != label) continue;
                if (done[i].as<bool>()) mask |= 1 << t; else mask &= ~(1 << t);
                break;
              }
            }
            ESP_LOGI("ha_sync", "Daypart %d done mask 0x%02x -> 0x%02x from Home Assistant", slot, id(slot_done)[slot], mask);
            id(slot_done)[slot] = mask;
            return true;
          });
      - mqtt.publish:
          topic: !lambda 'return "todo_3310/command/slot/" + std::to_string(slot);'
          payload: ""
          retain: true
      # The state reported on connect may predate this command; report the result so HA
      # ends up with the same list state as the device.
      - script.execute:
          id: publish_slot_state
          slot: !lambda return slot;
      - if:
          condition:
            lambda: return slot == id(active_slot);
          then:
            - component.update: todo_display

  # Last contact and wake reason. Sent on connect and again right before sleeping, so
  # both arrive even if the first attempt was lost or the RTC only became valid
  # after SNTP synced during the awake window.
  - id: publish_status
    mode: queued
    then:
      # UTC with "Z" so Home Assistant can use it as a timestamp. Not sent while the
      # RTC has no valid time.
      - if:
          condition:
            lambda: return id(rtc_time).now().is_valid();
          then:
            - mqtt.publish:
                topic: todo_3310/state/last_seen
                payload: !lambda |-
                  return ESPTime::from_epoch_utc(id(rtc_time).now().timestamp).strftime("%Y-%m-%dT%H:%M:%SZ");
                retain: true
      # rtc_alarm: scheduled wake from full power-off (battery). timer: scheduled wake
      # from ESP32 deep sleep (USB fallback). side_button: SIDE from deep sleep.
      # cold_boot: SIDE from power-off, USB plug-in, reset or flash.
      - mqtt.publish:
          topic: todo_3310/state/wake_reason
          payload: !lambda |-
            if (id(rtc_alarm_wake)) return std::string("rtc_alarm");
            switch (esp_sleep_get_wakeup_cause()) {
              case ESP_SLEEP_WAKEUP_TIMER: return std::string("timer");
              case ESP_SLEEP_WAKEUP_EXT0: return std::string("side_button");
              case ESP_SLEEP_WAKEUP_UNDEFINED: return std::string("cold_boot");
              default: return std::string("other");
            }
          retain: true

  - id: scheduled_sleep_cycle
    mode: restart
    then:
      # Restarted on every interaction. Start before display refresh so total awake time
      # is about ${awake_timeout} from the last event, including the synchronous ePaper
      # refresh. Right after the list was finished it is ${done_awake_timeout} instead; any
      # later interaction (e.g. TOP: UNDO) goes back to the normal window.
      - lambda: |-
          id(going_to_sleep) = false;
          id(finish_sleep) = id(finish_requested);
          id(finish_requested) = false;
      - if:
          condition:
            lambda: return id(finish_sleep);
          then:
            - delay: ${done_awake_timeout}
          else:
            - delay: ${awake_timeout}
      - lambda: |-
          auto now = id(rtc_time).now();
          id(sleep_target_epoch) = 0;
          if (!now.is_valid()) {
            // Fallback if RTC has no valid time: retry after 10 minutes.
            id(next_sleep_ms) = 10 * 60 * 1000;
            ESP_LOGW("sleep", "RTC time invalid; fallback sleep is 10 minutes");
            return;
          }
          // Sleep until shortly after the next daypart start (today or tomorrow).
          const int now_s = now.hour * 3600 + now.minute * 60 + now.second;
          int target_s = -1;
          for (int s = 0; s < 3; s++) {
            int start_s = id(wake_hour)[s] * 3600 + id(wake_minute)[s] * 60 + ${wake_margin_s};
            if (start_s <= now_s) start_s += 24 * 3600;
            if (target_s < 0 || start_s < target_s) target_s = start_s;
          }
          int seconds = target_s - now_s;
          if (seconds < 30) seconds = 30;
          id(next_sleep_ms) = seconds * 1000;
          id(sleep_target_epoch) = now.timestamp + seconds;
          ESP_LOGI("sleep", "RTC time %02d:%02d:%02d; next scheduled wake in %d seconds", now.hour, now.minute, now.second, seconds);
      - mqtt.publish:
          topic: todo_3310/state/seconds_to_wakeup
          payload: !lambda 'return std::to_string(id(next_sleep_ms) / 1000);'
          retain: true
      # Planned wake as a UTC timestamp, rounded up to the full minute like the RTC
      # alarm. Not sent when the RTC has no valid time.
      - if:
          condition:
            lambda: return id(sleep_target_epoch) != 0;
          then:
            - mqtt.publish:
                topic: todo_3310/state/next_wakeup
                payload: !lambda |-
                  const time_t t = (time_t) (((id(sleep_target_epoch) + 59) / 60) * 60);
                  return ESPTime::from_epoch_utc(t).strftime("%Y-%m-%dT%H:%M:%SZ");
                retain: true
      - script.execute: publish_status
      # Draw the sleep image (no selection bar, "SIDE: WAKE" in the footer) with a full
      # refresh. Partial refreshes during the awake window leave ghosting, especially where
      # the black selection bar moved; the full refresh clears it before the image has to
      # stay on the panel for hours. The driver has no public "full refresh now" call, so
      # reset its update counter: the next update is then a full one.
      - lambda: |-
          id(going_to_sleep) = true;
          struct Access : waveshare_epaper::WaveshareEPaperTypeA {
            static uint32_t waveshare_epaper::WaveshareEPaperTypeA::*at_update() { return &Access::at_update_; }
          };
          id(todo_display)->*Access::at_update() = 0;
      - component.update: todo_display
      # Let the panel finish the full refresh before the board powers down.
      - delay: 3s
      # Program the BM8563 alarm for the planned wake. The pcf8563 time platform keeps
      # the RTC in UTC, so the alarm is written in UTC too. The alarm only matches
      # minute and hour (day and weekday disabled with 0x80) and has no seconds field,
      # so the wake is rounded up to the next full minute: daypart start + 1 min.
      - lambda: |-
          id(rtc_alarm_armed) = false;
          const uint32_t target = id(sleep_target_epoch);
          const auto now = id(rtc_time).now();
          if (target == 0 || !now.is_valid()) {
            ESP_LOGW("sleep", "RTC alarm skipped: no valid sleep target or RTC time");
            return;
          }
          const time_t alarm_epoch = (time_t) (((target + 59) / 60) * 60);
          if (alarm_epoch <= now.timestamp + 5) {
            ESP_LOGW("sleep", "RTC alarm skipped: target is not in the future");
            return;
          }
          const auto alarm_utc = ESPTime::from_epoch_utc(alarm_epoch);
          const auto alarm_local = ESPTime::from_epoch_local(alarm_epoch);
          if (!alarm_utc.is_valid()) {
            ESP_LOGW("sleep", "RTC alarm skipped: invalid alarm timestamp");
            return;
          }
          auto bcd = [](int value) -> uint8_t { return (uint8_t) (((value / 10) << 4) | (value % 10)); };
          // Disarm and clear AF/TF first so INT is released before AIE is set again.
          const uint8_t disarm[2] = {0x01, 0x00};
          if (id(bus_int)->write(0x51, disarm, sizeof(disarm)) != i2c::ERROR_OK) {
            ESP_LOGW("sleep", "RTC alarm skipped: BM8563 not responding");
            return;
          }
          const uint8_t alarm_regs[5] = {0x09, bcd(alarm_utc.minute), bcd(alarm_utc.hour), 0x80, 0x80};
          const uint8_t arm[2] = {0x01, 0x02};  // AIE=1, AF=0, TF=0, TIE=0
          if (id(bus_int)->write(0x51, alarm_regs, sizeof(alarm_regs)) != i2c::ERROR_OK ||
              id(bus_int)->write(0x51, arm, sizeof(arm)) != i2c::ERROR_OK) {
            ESP_LOGW("sleep", "RTC alarm skipped: cannot write alarm registers");
            id(bus_int)->write(0x51, disarm, sizeof(disarm));
            return;
          }
          uint8_t reg = 0x01;
          uint8_t status = 0;
          if (id(bus_int)->write_readv(0x51, &reg, 1, &status, 1) != i2c::ERROR_OK || (status & 0x0A) != 0x02) {
            ESP_LOGW("sleep", "RTC alarm readback failed: status 0x%02X", status);
            id(bus_int)->write(0x51, disarm, sizeof(disarm));
            return;
          }
          id(rtc_alarm_armed) = true;
          ESP_LOGI("sleep", "RTC alarm armed for %02d:%02d local (%02d:%02d UTC)",
                   alarm_local.hour, alarm_local.minute, alarm_utc.hour, alarm_utc.minute);
      # Power off. GPIO12 low should release the CoreInk power latch, but on battery
      # the idle-high UART0 TX (GPIO1) back-feeds the unpowered CP2104 USB chip, puts
      # about 2.3 V on USB_5V, turns Q5 on via D19/R51 and keeps the latch held: the
      # board then stays on at about 1.16 mA. So UART0 is stopped and GPIO1 driven low
      # first (found and measured by weekroom in issue #14: ~1 uA afterwards).
      # On battery the board loses power inside this lambda. With USB connected the
      # 5 V rail keeps it alive: restore UART and GPIO12 and fall through to the ESP32
      # deep-sleep timer below, as before.
      - lambda: |-
          if (!id(rtc_alarm_armed)) return;
          ESP_LOGI("sleep", "Powering off: GPIO12 low, BM8563 alarm is the wake source");
          global_preferences->sync();
          // The ESPHome logger drives UART0 through the ESP-IDF driver, not Arduino
          // Serial: wait for the last log line, then detach TX from the UART and
          // drive the pin low. The driver itself stays installed.
          uart_wait_tx_done(UART_NUM_0, pdMS_TO_TICKS(100));
          gpio_reset_pin(GPIO_NUM_1);
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_reset_pin(GPIO_NUM_3);
          gpio_set_direction(GPIO_NUM_3, GPIO_MODE_INPUT);
          gpio_set_pull_mode(GPIO_NUM_3, GPIO_FLOATING);
          gpio_hold_dis(GPIO_NUM_12);
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 0);
          delay(300);
          // Still running: USB keeps the board powered. Reattach UART0 for the log.
          gpio_set_level(GPIO_NUM_12, 1);
          uart_set_pin(UART_NUM_0, 1, 3, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE);
          // Disarm the alarm so it cannot fire into the deep-sleep fallback and hold
          // the latch; the ESP32 timer is the wake source on USB.
          const uint8_t disarm[2] = {0x01, 0x00};
          id(bus_int)->write(0x51, disarm, sizeof(disarm));
          id(rtc_alarm_armed) = false;
          ESP_LOGW("sleep", "Still powered after GPIO12 low (USB connected); using ESP32 deep sleep");
      # Convert the remaining real time into timer time with the learned scale, and note
      # the start so the next timer wake can measure the drift again.
      - lambda: |-
          auto now = id(rtc_time).now();
          const uint32_t target = id(sleep_target_epoch);
          if (target == 0 || !now.is_valid()) {
            id(sleep_start_epoch) = 0;
            return;
          }
          int64_t remaining_s = (int64_t) target - now.timestamp;
          if (remaining_s < 30) remaining_s = 30;
          id(next_sleep_ms) = (int) (remaining_s * 1000.0f * id(sleep_timer_scale));
          id(sleep_start_epoch) = now.timestamp;
          id(sleep_timer_ms) = id(next_sleep_ms);
          ESP_LOGI("sleep", "Timer set to %d ms for %lld real s (scale %.4f)", id(next_sleep_ms), (long long) remaining_s, id(sleep_timer_scale));
      - deep_sleep.enter:
          sleep_duration: !lambda "return id(next_sleep_ms);"

# Include printable ASCII plus German umlauts and euro; glyphs is an explicit character set here.
# Keep this file pure ASCII: umlauts are written as \u escapes (YAML in the glyph lists, C++ in
# the lambdas and initial values), because some ESPHome setups fail to parse raw UTF-8.
font:
  - file: "fonts/segoeuithibd.ttf"
    id: font_xs
    size: 10
    glyphs:
      - " "
      - "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "\u00E4\u00F6\u00FC\u00C4\u00D6\u00DC\u00DF\u20AC"
  - file: "fonts/segoeuithibd.ttf"
    id: font_sm
    size: 12
    glyphs:
      - " "
      - "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "\u00E4\u00F6\u00FC\u00C4\u00D6\u00DC\u00DF\u20AC"
  - file: "fonts/segoeuithibd.ttf"
    id: font_md
    size: 15
    glyphs:
      - " "
      - "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "\u00E4\u00F6\u00FC\u00C4\u00D6\u00DC\u00DF\u20AC"

display:
  - platform: waveshare_epaper
    id: todo_display
    model: ${epaper.type}
    update_interval: never
    rotation: ${epaper.rotation}
    cs_pin: ${epaper.cs}
    dc_pin: ${epaper.dc}
    reset_pin: ${epaper.reset}
    busy_pin:
      number: ${epaper.busy.pin}
      inverted: ${epaper.busy.inverted}
    full_update_every: ${epaper.full_update_every}
    lambda: |-
      // Clear the whole framebuffer on every render. Otherwise the ePaper buffer may
      // retain the previous inverted selection row and make two rows look selected.
      it.fill(COLOR_OFF);
      // 200x200 monochrome Nokia-inspired UI.
      // Status bar: Wi-Fi, last wake timestamp, battery.
      it.filled_rectangle(0, 0, 200, 21, COLOR_ON);

      int bars = 0;
      if (id(wifi_signal_dbm).has_state()) {
        const float rssi = id(wifi_signal_dbm).state;
        if      (rssi >= -55) bars = 4;
        else if (rssi >= -65) bars = 3;
        else if (rssi >= -75) bars = 2;
        else if (rssi >= -85) bars = 1;
      }
      if (bars >= 1) it.filled_rectangle(5, 14, 3, 4, COLOR_OFF); else it.rectangle(5, 14, 3, 4, COLOR_OFF);
      if (bars >= 2) it.filled_rectangle(10, 11, 3, 7, COLOR_OFF); else it.rectangle(10, 11, 3, 7, COLOR_OFF);
      if (bars >= 3) it.filled_rectangle(15, 8, 3, 10, COLOR_OFF); else it.rectangle(15, 8, 3, 10, COLOR_OFF);
      if (bars >= 4) it.filled_rectangle(20, 5, 3, 13, COLOR_OFF); else it.rectangle(20, 5, 3, 13, COLOR_OFF);

      // Last wake time, centered in the larger status font.
      auto now = id(rtc_time).now();
      if (id(last_wakeup_daykey) > 0 && id(last_wakeup_hour) >= 0 && id(last_wakeup_minute) >= 0) {
        const int current_daykey = now.is_valid() ? now.year * 10000 + now.month * 100 + now.day_of_month : -1;
        if (current_daykey == id(last_wakeup_daykey)) {
          it.printf(100, 0, id(font_md), COLOR_OFF, TextAlign::TOP_CENTER, "%02d:%02d", id(last_wakeup_hour), id(last_wakeup_minute));
        } else {
          const int mm = (id(last_wakeup_daykey) / 100) % 100;
          const int dd = id(last_wakeup_daykey) % 100;
          it.printf(100, 0, id(font_md), COLOR_OFF, TextAlign::TOP_CENTER, "%02d.%02d %02d:%02d", dd, mm, id(last_wakeup_hour), id(last_wakeup_minute));
        }
      } else {
        it.print(100, 0, id(font_md), COLOR_OFF, TextAlign::TOP_CENTER, "--:--");
      }

      // Battery outline filled to the approximate (voltage-derived) level, with the
      // percentage on top. The number is drawn twice, each time clipped to one side of
      // the fill edge: black over the white fill, white over the empty part.
      it.rectangle(164, 3, 30, 15, COLOR_OFF);
      it.filled_rectangle(194, 7, 3, 7, COLOR_OFF);
      if (id(battery_percent).has_state()) {
        int batt = (int) id(battery_percent).state;
        if (batt < 0) batt = 0;
        if (batt > 100) batt = 100;
        const int in_x = 166, in_y = 5, in_w = 26, in_h = 11;
        const int fill_w = batt * in_w / 100;
        if (fill_w > 0) {
          it.filled_rectangle(in_x, in_y, fill_w, in_h, COLOR_OFF);
          it.start_clipping(in_x, in_y, in_x + fill_w, in_y + in_h);
          it.printf(179, 3, id(font_xs), COLOR_ON, TextAlign::TOP_CENTER, "%d", batt);
          it.end_clipping();
        }
        if (fill_w < in_w) {
          it.start_clipping(in_x + fill_w, in_y, in_x + in_w, in_y + in_h);
          it.printf(179, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "%d", batt);
          it.end_clipping();
        }
      } else {
        it.print(179, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "--");
      }

      // Fixed UI texts in the language chosen in Home Assistant.
      const bool de = id(ui_de);
      const char *t_all_done = de ? "Alles erledigt!" : "All done!";
      const char *t_nothing = de ? "Nichts zu tun" : "Nothing to do";
      const char *t_select = de ? "AUF/AB: W\u00C4HLEN" : "UP/DOWN: SELECT";
      const char *t_ok = de ? "DR\u00DCCKEN: OK" : "PRESS: OK";
      const char *t_undo = de ? "OBEN: ZUR\u00DCCK" : "TOP: UNDO";
      const char *t_next = de ? "N\u00C4CHSTE %02d:%02d" : "NEXT %02d:%02d";
      const char *t_wake = de ? "SEITE: WECKEN" : "SIDE: WAKE";
      const char *t_batt_low = de ? "!! AKKU SCHWACH !!" : "!! BATTERY LOW !!";
      const char *t_batt_empty = de ? "AKKU LEER - LADEN" : "BATTERY EMPTY - CHARGE";

      const bool low_battery = id(battery_percent).has_state() && id(battery_percent).state <= 10.0f;
      const bool critical_battery = id(battery_voltage).has_state() && id(battery_voltage).state <= 3.40f;

      const int slot = id(active_slot);
      const auto &labels = id(slot_tasks)[slot];
      const int count = labels.size();
      const int mask = id(slot_done)[slot];
      int done = 0;
      for (int i = 0; i < count; i++) if (mask & (1 << i)) done++;
      const bool complete = done == count;

      // Daypart title. font_md glyphs reach about 17 px below y, so the title ends well
      // above the separator line instead of touching it.
      const std::string titles[3] = {id(slot_title_0), id(slot_title_1), id(slot_title_2)};
      std::string title = titles[slot];
      // Uppercase ASCII and the UTF-8 umlauts ae/oe/ue (0xC3 0xA4.. -> 0xC3 0x84..).
      for (size_t i = 0; i < title.size(); i++) {
        const unsigned char c = title[i];
        if (c == 0xC3 && i + 1 < title.size() && ((unsigned char) title[i + 1] == 0xA4 || (unsigned char) title[i + 1] == 0xB6 || (unsigned char) title[i + 1] == 0xBC)) title[++i] -= 0x20;
        else title[i] = toupper(c);
      }
      it.print(7, 23, id(font_md), COLOR_ON, title.c_str());
      it.printf(193, 23, id(font_md), COLOR_ON, TextAlign::TOP_RIGHT, "%d/%d", done, count);
      it.line(5, 45, 195, 45);

      // Fixed order set on boot/wakeup; toggling a task changes only its appearance,
      // not its position until the next wakeup. A finished list shows only the finish card.
      if (!complete) {
        for (int row = 0; row < count; row++) {
          const int task = id(display_order)[row];
          const int y = 49 + row * 25;
          const bool is_done = mask & (1 << task);
          // The sleep image shows no selection: nothing can be selected while asleep.
          const bool is_selected = !id(going_to_sleep) && task == id(selected_task);
          const auto fg = is_selected ? COLOR_OFF : COLOR_ON;
          if (is_selected) it.filled_rectangle(5, y, 190, 22, COLOR_ON);
          it.rectangle(10, y + 3, 15, 15, fg);
          if (is_done) {
            it.line(12, y + 10, 16, y + 14, fg);
            it.line(16, y + 14, 23, y + 5, fg);
          }
          it.print(32, y + 2, id(font_sm), fg, labels[task].c_str());
          if (is_done) {
            // Measure the rendered label so the strike-through fits any task name.
            int tx, ty, text_w, text_h;
            it.get_text_bounds(32, y + 2, labels[task].c_str(), id(font_sm), TextAlign::TOP_LEFT, &tx, &ty, &text_w, &text_h);
            const int strike_end = std::min(tx + text_w, 190);
            if (text_w > 0) it.line(32, y + 12, strike_end, y + 12, fg);
          } else if (is_selected) {
            it.filled_triangle(183, y + 6, 191, y + 6, 187, y + 14, COLOR_OFF);
          }
        }
      }

      // Progress segments follow the SAME order as the displayed rows and share the
      // 184 px strip between however many tasks the daypart has. A finished list hides
      // them; the finish card already says everything is done.
      for (int i = 0; i < count && !complete; i++) {
        const int x0 = 8 + i * 188 / count;
        const int x1 = 8 + (i + 1) * 188 / count - 4;
        if (mask & (1 << id(display_order)[i])) it.filled_rectangle(x0, 175, x1 - x0, 6, COLOR_ON);
        else it.rectangle(x0, 175, x1 - x0, 6, COLOR_ON);
      }

      // Next daypart start, shown in the footer.
      int next = 0;
      if (now.is_valid()) {
        const int secs = now.hour * 3600 + now.minute * 60 + now.second;
        int best = -1;
        for (int s = 0; s < 3; s++) {
          int candidate = id(wake_hour)[s] * 3600 + id(wake_minute)[s] * 60;
          if (candidate <= secs) candidate += 24 * 3600;
          if (best < 0 || candidate < best) { best = candidate; next = s; }
        }
      } else {
        next = (slot + 1) % 3;
      }

      // Finished card: compact framed panel + pixel smiley.
      if (complete) {
        it.filled_rectangle(25, 67, 150, 69, COLOR_OFF);
        it.rectangle(25, 67, 150, 69, COLOR_ON);
        it.rectangle(28, 70, 144, 63, COLOR_ON);
        it.circle(100, 86, 8, COLOR_ON);
        it.filled_rectangle(96, 83, 2, 3, COLOR_ON);
        it.filled_rectangle(102, 83, 2, 3, COLOR_ON);
        it.line(95, 90, 98, 93, COLOR_ON);
        it.line(98, 93, 102, 93, COLOR_ON);
        it.line(102, 93, 105, 90, COLOR_ON);
        it.print(100, 101, id(font_sm), COLOR_ON, TextAlign::TOP_CENTER, count == 0 ? t_nothing : t_all_done);
        // Message of the finished daypart, e.g. "See you tomorrow!" in the evening.
        const std::string messages[3] = {id(wake_message_0), id(wake_message_1), id(wake_message_2)};
        it.print(100, 117, id(font_xs), COLOR_ON, TextAlign::TOP_CENTER, messages[slot].c_str());
      }

      // Footer doubles as a persistent low-battery warning; tasks remain visible.
      // font_xs glyphs end about 11 px below y; the bar starts higher than before so the
      // text keeps a margin to the bottom edge of the physical panel.
      it.filled_rectangle(0, 184, 200, 16, COLOR_ON);
      if (critical_battery) {
        it.print(100, 185, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, t_batt_empty);
      } else if (low_battery) {
        it.print(100, 185, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, t_batt_low);
      } else if (id(going_to_sleep)) {
        it.printf(6, 185, id(font_xs), COLOR_OFF, t_next, id(wake_hour)[next], id(wake_minute)[next]);
        it.print(194, 185, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, t_wake);
      } else if (complete) {
        if (id(last_action_task) >= 0) it.print(6, 185, id(font_xs), COLOR_OFF, t_undo);
        else it.printf(6, 185, id(font_xs), COLOR_OFF, t_next, id(wake_hour)[next], id(wake_minute)[next]);
      } else {
        it.print(6, 185, id(font_xs), COLOR_OFF, t_select);
        it.print(194, 185, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, t_ok);
      }

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_dbm
    update_interval: 30s
    entity_category: diagnostic

  - platform: adc
    pin: ${coreink_battery_pin}
    id: battery_voltage
    update_interval: 1s
    samples: 10
    accuracy_decimals: 2
    filters:
      - multiply: ${battery_divider}
      - median:
          window_size: 3
          send_every: 3
          send_first_at: 3
    name: "Battery Voltage"
    entity_category: diagnostic
    device_class: voltage
    unit_of_measurement: V
    on_value:
      then:
        - component.update: battery_percent
        - mqtt.publish:
            topic: todo_3310/state/battery_voltage
            payload: !lambda 'return to_string(id(battery_voltage).state);'
            retain: true

  - platform: template
    name: "Battery percent"
    id: battery_percent
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.30 -> 0.0
            - 3.50 -> 5.0
            - 3.70 -> 25.0
            - 3.80 -> 50.0
            - 3.95 -> 75.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
    entity_category: diagnostic
    device_class: battery
    unit_of_measurement: "%"
    on_value:
      then:
        - mqtt.publish:
            topic: todo_3310/state/battery_percent
            payload: !lambda 'return to_string(id(battery_percent).state);'
            retain: true

binary_sensor:
  # Same physical pin as deep_sleep.wakeup_pin; use the one central button definition.
  - platform: gpio
    pin:
      number: ${coreink_btn.side.number}
      inverted: ${coreink_btn.side.inverted}
      allow_other_uses: ${coreink_btn.side.other_uses}
    id: button_wakeup_side
    name: "Side Wake Button"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - logger.log: "Side wake button pressed"
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

  # A finished (or empty) list is locked: UP/DOWN/PRESS only extend the awake window and
  # do not redraw, so the finish card stays and nothing can be unchecked from the menu.
  - platform: gpio
    pin:
      number: ${coreink_btn.stick.up.number}
      inverted: ${coreink_btn.stick.up.inverted}
      allow_other_uses: ${coreink_btn.stick.up.other_uses}
    id: dial_up
    name: "Joystick Up"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - script.execute: scheduled_sleep_cycle
        - if:
            condition:
              lambda: |-
                const int s = id(active_slot);
                const int all = (1 << id(slot_tasks)[s].size()) - 1;
                return (id(slot_done)[s] & all) != all;
            then:
              - lambda: |-
                  const int count = id(slot_tasks)[id(active_slot)].size();
                  int pos = 0;
                  for (int i = 0; i < count; i++) if (id(display_order)[i] == id(selected_task)) pos = i;
                  id(selected_task) = id(display_order)[(pos + count - 1) % count];
                  ESP_LOGI("ui", "UP: selected task %d", id(selected_task));
              - component.update: todo_display

  - platform: gpio
    pin:
      number: ${coreink_btn.stick.press.number}
      inverted: ${coreink_btn.stick.press.inverted}
      allow_other_uses: ${coreink_btn.stick.press.other_uses}
    id: dial_press
    name: "Joystick Press"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - script.execute: scheduled_sleep_cycle
        - if:
            condition:
              lambda: |-
                const int s = id(active_slot);
                const int all = (1 << id(slot_tasks)[s].size()) - 1;
                return (id(slot_done)[s] & all) != all;
            then:
              - lambda: |-
                  const int s = id(active_slot);
                  const int i = id(selected_task);
                  id(last_action_task) = i;
                  id(slot_done)[s] ^= 1 << i;
                  ESP_LOGI("ui", "SELECT: toggled task %d of daypart %d; now %s", i, s, (id(slot_done)[s] & (1 << i)) ? "done" : "open");
              - script.execute:
                  id: publish_slot_state
                  slot: !lambda return id(active_slot);
              - if:
                  condition:
                    lambda: |-
                      const int s = id(active_slot);
                      const int all = (1 << id(slot_tasks)[s].size()) - 1;
                      return (id(slot_done)[s] & all) == all;
                  then:
                    - rtttl.play: "${beep_done}"
                    - component.update: todo_display
                    # Finished: sleep soon instead of after the full awake window.
                    - lambda: id(finish_requested) = true;
                    - script.execute: scheduled_sleep_cycle
                  else:
                    - component.update: todo_display
            else:
              - logger.log: "SELECT: list complete, toggling locked"

  - platform: gpio
    pin:
      number: ${coreink_btn.stick.down.number}
      inverted: ${coreink_btn.stick.down.inverted}
      allow_other_uses: ${coreink_btn.stick.down.other_uses}
    id: dial_down
    name: "Joystick Down"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - script.execute: scheduled_sleep_cycle
        - if:
            condition:
              lambda: |-
                const int s = id(active_slot);
                const int all = (1 << id(slot_tasks)[s].size()) - 1;
                return (id(slot_done)[s] & all) != all;
            then:
              - lambda: |-
                  const int count = id(slot_tasks)[id(active_slot)].size();
                  int pos = 0;
                  for (int i = 0; i < count; i++) if (id(display_order)[i] == id(selected_task)) pos = i;
                  id(selected_task) = id(display_order)[(pos + 1) % count];
                  ESP_LOGI("ui", "DOWN: selected task %d", id(selected_task));
              - component.update: todo_display

  # TOP undoes the most recent toggle of this awake session (also on a finished list).
  - platform: gpio
    pin:
      number: ${coreink_btn.top.number}
      inverted: ${coreink_btn.top.inverted}
      allow_other_uses: ${coreink_btn.top.other_uses}
    id: button_top
    name: "Top Button"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - script.execute: scheduled_sleep_cycle
        - if:
            condition:
              lambda: return id(last_action_task) >= 0;
            then:
              - lambda: |-
                  const int i = id(last_action_task);
                  id(slot_done)[id(active_slot)] ^= 1 << i;
                  id(selected_task) = i;
                  id(last_action_task) = -1;
                  ESP_LOGI("ui", "TOP: undid most recent toggle of task %d", i);
              - script.execute:
                  id: publish_slot_state
                  slot: !lambda return id(active_slot);
              - component.update: todo_display
            else:
              - logger.log: "TOP: no recent task action to undo"

switch:
  - platform: gpio
    name: "LED"
    id: coreink_led
    pin:
      number: ${coreink_led_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    entity_category: config

  - platform: gpio
    id: power_hold
    pin: ${coreink_pwr_mos_pin}
    restore_mode: ALWAYS_ON
    internal: true

time:
  - platform: pcf8563
    id: rtc_time
    i2c_id: bus_int
    address: 0x51
    timezone: ${timezone}
    update_interval: never
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      then:
        # Not pcf8563.write_time: it writes the component's whole cached register block
        # from 0x00, including Control_status_2 (0x01) and the alarm registers
        # (0x09-0x0C), and would overwrite the alarm for the next wake. Write only
        # Control_status_1 (STOP=0) and the time registers 0x02-0x08, encoded the
        # same way ESPHome does (UTC, weekday = ESPTime day_of_week).
        - lambda: |-
            auto now = id(sntp_time).utcnow();
            if (!now.is_valid()) {
              ESP_LOGW("rtc", "SNTP time is not valid; RTC not updated");
              return;
            }
            auto bcd = [](int value) -> uint8_t { return (uint8_t) (((value / 10) << 4) | (value % 10)); };
            const uint8_t control_1[2] = {0x00, 0x00};
            const uint8_t time_regs[8] = {
                0x02,
                bcd(now.second),
                bcd(now.minute),
                bcd(now.hour),
                bcd(now.day_of_month),
                (uint8_t) (now.day_of_week & 0x07),
                bcd(now.month),
                bcd(now.year % 100),
            };
            if (id(bus_int)->write(0x51, control_1, sizeof(control_1)) != i2c::ERROR_OK ||
                id(bus_int)->write(0x51, time_regs, sizeof(time_regs)) != i2c::ERROR_OK) {
              ESP_LOGW("rtc", "I2C write to BM8563 time registers failed");
            } else {
              ESP_LOGI("rtc", "BM8563 set to %04d-%02d-%02d %02d:%02d:%02d UTC; alarm untouched",
                       now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
            }
