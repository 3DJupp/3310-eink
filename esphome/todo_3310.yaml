      - "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "\u00E4\u00F6\u00FC\u00C4\u00D6\u00DC\u00DF\u20AC"
  - file: "fonts/segoeuithibd.ttf"
    id: font_l
    size: 20
    glyphs:
      - " "
      - "!\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "\u00E4\u00F6\u00FC\u00C4\u00D6\u00DC\u00DF\u20AC"

display:
  - platform: waveshare_epaper
    id: todo_display
    model: ${epaper.type}
    update_interval: never
    rotation: ${epaper.rotation}
    cs_pin: ${epaper.cs}
    dc_pin: ${epaper.dc}
    reset_pin: ${epaper.reset}
    busy_pin:
      number: ${epaper.busy.pin}
      inverted: ${epaper.busy.inverted}
    full_update_every: ${epaper.full_update_every}
    lambda: |-
      // Clear the whole framebuffer on every render. Otherwise the ePaper buffer may
      // retain the previous inverted selection row and make two rows look selected.
      it.fill(COLOR_OFF);
      // 200x200 monochrome Nokia-inspired UI.
      // Status bar: last wake timestamp, approximate battery percent/icon, Wi-Fi.
      it.filled_rectangle(0, 0, 200, 21, COLOR_ON);

      int bars = 0;
      if (id(wifi_signal_dbm).has_state()) {
        const float rssi = id(wifi_signal_dbm).state;
        if      (rssi >= -55) bars = 4;
        else if (rssi >= -65) bars = 3;
        else if (rssi >= -75) bars = 2;
        else if (rssi >= -85) bars = 1;
      }
      if (bars >= 1) it.filled_rectangle(5, 14, 3, 4, COLOR_OFF); else it.rectangle(5, 14, 3, 4, COLOR_OFF);
      if (bars >= 2) it.filled_rectangle(10, 11, 3, 7, COLOR_OFF); else it.rectangle(10, 11, 3, 7, COLOR_OFF);
      if (bars >= 3) it.filled_rectangle(15, 8, 3, 10, COLOR_OFF); else it.rectangle(15, 8, 3, 10, COLOR_OFF);
      if (bars >= 4) it.filled_rectangle(20, 5, 3, 13, COLOR_OFF); else it.rectangle(20, 5, 3, 13, COLOR_OFF);

      auto now = id(rtc_time).now();
      if (id(last_wakeup_daykey) > 0 && id(last_wakeup_hour) >= 0 && id(last_wakeup_minute) >= 0) {
        const int current_daykey = now.is_valid() ? now.year * 10000 + now.month * 100 + now.day_of_month : -1;
        if (current_daykey == id(last_wakeup_daykey)) {
          it.printf(91, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "%02d:%02d", id(last_wakeup_hour), id(last_wakeup_minute));
        } else {
          const int mm = (id(last_wakeup_daykey) / 100) % 100;
          const int dd = id(last_wakeup_daykey) % 100;
          it.printf(91, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "%02d.%02d %02d:%02d", dd, mm, id(last_wakeup_hour), id(last_wakeup_minute));
        }
      } else {
        it.print(91, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "--.-- --:--");
      }

      // Battery percentage is voltage-derived and therefore approximate.
      int batt = -1;
      if (id(battery_percent).has_state()) {
        batt = (int) id(battery_percent).state;
        if (batt < 0) batt = 0;
        if (batt > 100) batt = 100;
        it.printf(151, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, "%d%%", batt);
      } else {
        it.print(151, 3, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, "--%");
      }
      it.rectangle(160, 4, 26, 13, COLOR_OFF);
      it.filled_rectangle(186, 8, 3, 5, COLOR_OFF);
      if (batt > 0) {
        int fill_w = (batt * 22) / 100;
        if (fill_w > 0) it.filled_rectangle(162, 6, fill_w, 9, COLOR_OFF);
      }

      const bool low_battery = id(battery_percent).has_state() && id(battery_percent).state <= 10.0f;
      const bool critical_battery = id(battery_voltage).has_state() && id(battery_voltage).state <= 3.40f;

      it.print(7, 25, id(font_l), COLOR_ON, "TODO");
      bool done_flags[5] = {id(task_0), id(task_1), id(task_2), id(task_3), id(task_4)};
      const char *labels[5] = {id(task_label_0).c_str(), id(task_label_1).c_str(), id(task_label_2).c_str(), id(task_label_3).c_str(), id(task_label_4).c_str()};
      int done = 0;
      for (int i = 0; i < 5; i++) if (done_flags[i]) done++;
      int selected = id(selected_task);
      if (selected < 0 || selected > 4) selected = 0;
      it.printf(193, 27, id(font_md), COLOR_ON, TextAlign::TOP_RIGHT, "%d/5", done);
      it.line(5, 47, 195, 47);

      // Fixed order set on boot/wakeup; toggling a task changes only its appearance,
      // not its position until the next wakeup.
      int order[5] = {id(display_order_0), id(display_order_1), id(display_order_2), id(display_order_3), id(display_order_4)};

      // When all tasks are done, show the finish card alone. Navigation dismisses it
      // so the completed rows can be browsed without highlights bleeding through the card.
      if (!(done == 5 && !id(finish_card_dismissed))) {
        for (int row = 0; row < 5; row++) {
          const int task = order[row];
          const int y = 51 + row * 25;
          const bool is_selected = (task == selected);
          const auto fg = is_selected ? COLOR_OFF : COLOR_ON;
          if (is_selected) it.filled_rectangle(5, y, 190, 22, COLOR_ON);
          if (done_flags[task]) {
            it.rectangle(10, y + 3, 15, 15, fg);
            it.line(12, y + 10, 16, y + 14, fg);
            it.line(16, y + 14, 23, y + 5, fg);
          } else {
            it.rectangle(10, y + 3, 15, 15, fg);
          }
          it.print(32, y + 2, id(font_sm), fg, labels[task]);
          if (done_flags[task]) {
            // Measure the rendered label so the strike-through fits any task name.
            int tx, ty, text_w, text_h;
            it.get_text_bounds(32, y + 2, labels[task], id(font_sm), TextAlign::TOP_LEFT, &tx, &ty, &text_w, &text_h);
            const int strike_end = std::min(tx + text_w, 190);
            if (text_w > 0) it.line(32, y + 12, strike_end, y + 12, fg);
          } else if (is_selected) {
            it.filled_triangle(183, y + 6, 191, y + 6, 187, y + 14, COLOR_OFF);
          }
        }
      }

      // Progress segments follow the SAME order as the displayed rows.
      // Open tasks are placed first at wakeup, completed tasks after them; therefore
      // the bar visually mirrors that order instead of the original task IDs.
      for (int i = 0; i < 5; i++) {
        const int x = 8 + i * 38;
        const int task = order[i];
        if (done_flags[task]) it.filled_rectangle(x, 180, 34, 7, COLOR_ON);
        else it.rectangle(x, 180, 34, 7, COLOR_ON);
      }

      // Finished card follows the attached mockup: compact framed panel + pixel smiley.
      if (done == 5 && !id(finish_card_dismissed)) {
        it.filled_rectangle(25, 67, 150, 69, COLOR_OFF);
        it.rectangle(25, 67, 150, 69, COLOR_ON);
        it.rectangle(28, 70, 144, 63, COLOR_ON);
        it.circle(100, 86, 8, COLOR_ON);
        it.filled_rectangle(96, 83, 2, 3, COLOR_ON);
        it.filled_rectangle(102, 83, 2, 3, COLOR_ON);
        it.line(95, 90, 98, 93, COLOR_ON);
        it.line(98, 93, 102, 93, COLOR_ON);
        it.line(102, 93, 105, 90, COLOR_ON);
        it.print(100, 103, id(font_sm), COLOR_ON, TextAlign::TOP_CENTER, "Alles erledigt!");
        if (now.is_valid()) {
          const int secs = now.hour * 3600 + now.minute * 60 + now.second;
          const int wake_s[3] = {id(wake_hour_0)*3600 + id(wake_minute_0)*60, id(wake_hour_1)*3600 + id(wake_minute_1)*60, id(wake_hour_2)*3600 + id(wake_minute_2)*60};
          int next = 0; int best = 24*3600 + wake_s[0];
          for (int i=0; i<3; i++) { int candidate = wake_s[i] > secs ? wake_s[i] : wake_s[i] + 24*3600; if (candidate < best) { best = candidate; next = i; } }
          const std::string messages[3] = {id(wake_message_0), id(wake_message_1), id(wake_message_2)};
          it.print(100, 120, id(font_xs), COLOR_ON, TextAlign::TOP_CENTER, messages[next].c_str());
        } else {
          it.print(100, 120, id(font_xs), COLOR_ON, TextAlign::TOP_CENTER, "Bis zum nächsten Wake");
        }
      }

      // Footer doubles as a persistent low-battery warning; tasks remain visible.
      it.filled_rectangle(0, 188, 200, 12, COLOR_ON);
      if (critical_battery) {
        it.print(100, 189, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "AKKU LEER - LADEN");
      } else if (low_battery) {
        it.print(100, 189, id(font_xs), COLOR_OFF, TextAlign::TOP_CENTER, "!! AKKU SCHWACH !!");
      } else if (done == 5) {
        it.print(6, 189, id(font_xs), COLOR_OFF, "TOP: UNDO");
        it.print(194, 189, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, "SIDE: WAKE");
      } else {
        it.print(6, 189, id(font_xs), COLOR_OFF, "UP/DOWN: WAHL");
        it.print(194, 189, id(font_xs), COLOR_OFF, TextAlign::TOP_RIGHT, "PRESS: OK");
      }

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_dbm
    update_interval: 30s
    entity_category: diagnostic

  - platform: adc
    pin: ${coreink_battery_pin}
    id: battery_voltage
    update_interval: 1s
    samples: 10
    accuracy_decimals: 2
    filters:
      - multiply: ${battery_divider}
      - median:
          window_size: 3
          send_every: 3
          send_first_at: 3
    name: "Battery Voltage"
    entity_category: diagnostic
    device_class: voltage
    unit_of_measurement: V
    on_value:
      then:
        - component.update: battery_percent
        - mqtt.publish:
            topic: todo_3310/state/battery_voltage
            payload: !lambda 'return to_string(id(battery_voltage).state);'
            retain: true

  - platform: template
    name: "Battery percent"
    id: battery_percent
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.30 -> 0.0
            - 3.50 -> 5.0
            - 3.70 -> 25.0
            - 3.80 -> 50.0
            - 3.95 -> 75.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
    entity_category: diagnostic
    device_class: battery
    unit_of_measurement: "%"
    on_value:
      then:
        - mqtt.publish:
            topic: todo_3310/state/battery_percent
            payload: !lambda 'return to_string(id(battery_percent).state);'
            retain: true
        - if:
            condition:
              lambda: return !id(battery_ui_refreshed);
            then:
              - lambda: id(battery_ui_refreshed) = true;
              - component.update: todo_display

binary_sensor:
  # Same physical pin as deep_sleep.wakeup_pin; use the one central button definition.
  - platform: gpio
    pin:
      number: ${coreink_btn.side.number}
      inverted: ${coreink_btn.side.inverted}
      allow_other_uses: ${coreink_btn.side.other_uses}
    id: button_wakeup_side
    name: "Side Wake Button"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - logger.log: "Side wake button pressed"
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

  - platform: gpio
    pin:
      number: ${coreink_btn.stick.up.number}
      inverted: ${coreink_btn.stick.up.inverted}
      allow_other_uses: ${coreink_btn.stick.up.other_uses}
    id: dial_up
    name: "Joystick Up"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - lambda: |-
            int order[5] = {id(display_order_0), id(display_order_1), id(display_order_2), id(display_order_3), id(display_order_4)};
            int pos = 0;
            for (int i = 0; i < 5; i++) if (order[i] == id(selected_task)) pos = i;
            id(selected_task) = order[(pos + 4) % 5];
            id(finish_card_dismissed) = true;
            ESP_LOGI("ui", "UP: selected task %d", id(selected_task));
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

  - platform: gpio
    pin:
      number: ${coreink_btn.stick.press.number}
      inverted: ${coreink_btn.stick.press.inverted}
      allow_other_uses: ${coreink_btn.stick.press.other_uses}
    id: dial_press
    name: "Joystick Press"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - lambda: |-
            const int i = id(selected_task);
            id(last_action_task) = i;
            if (i == 0) { id(last_action_previous) = id(task_0); id(task_0) = !id(task_0); }
            else if (i == 1) { id(last_action_previous) = id(task_1); id(task_1) = !id(task_1); }
            else if (i == 2) { id(last_action_previous) = id(task_2); id(task_2) = !id(task_2); }
            else if (i == 3) { id(last_action_previous) = id(task_3); id(task_3) = !id(task_3); }
            else if (i == 4) { id(last_action_previous) = id(task_4); id(task_4) = !id(task_4); }
            id(finish_card_dismissed) = false;
            ESP_LOGI("ui", "SELECT: toggled task %d; previous state=%s", i, id(last_action_previous) ? "done" : "open");
        - mqtt.publish:
            topic: !lambda 'return std::string("todo_3310/state/task/") + std::to_string(id(selected_task)) + "/done";'
            payload: !lambda |- 
              bool flags[5] = {id(task_0), id(task_1), id(task_2), id(task_3), id(task_4)};
              return flags[id(selected_task)] ? "ON" : "OFF";
            retain: true
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

  - platform: gpio
    pin:
      number: ${coreink_btn.stick.down.number}
      inverted: ${coreink_btn.stick.down.inverted}
      allow_other_uses: ${coreink_btn.stick.down.other_uses}
    id: dial_down
    name: "Joystick Down"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - lambda: |-
            int order[5] = {id(display_order_0), id(display_order_1), id(display_order_2), id(display_order_3), id(display_order_4)};
            int pos = 0;
            for (int i = 0; i < 5; i++) if (order[i] == id(selected_task)) pos = i;
            id(selected_task) = order[(pos + 1) % 5];
            id(finish_card_dismissed) = true;
            ESP_LOGI("ui", "DOWN: selected task %d", id(selected_task));
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

  - platform: gpio
    pin:
      number: ${coreink_btn.top.number}
      inverted: ${coreink_btn.top.inverted}
      allow_other_uses: ${coreink_btn.top.other_uses}
    id: button_top
    name: "Top Button"
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - lambda: |-
            const int i = id(last_action_task);
            if (i < 0 || i > 4) {
              ESP_LOGI("ui", "TOP: no recent task action to undo");
            } else {
              if (i == 0) id(task_0) = id(last_action_previous);
              else if (i == 1) id(task_1) = id(last_action_previous);
              else if (i == 2) id(task_2) = id(last_action_previous);
              else if (i == 3) id(task_3) = id(last_action_previous);
              else if (i == 4) id(task_4) = id(last_action_previous);
              id(selected_task) = i;
              id(last_action_task) = -1;
              id(finish_card_dismissed) = false;
              ESP_LOGI("ui", "TOP: undid most recent task toggle");
            }
        - if:
            condition:
              lambda: return id(last_action_task) >= 0 && id(last_action_task) <= 4;
            then:
              - mqtt.publish:
                  topic: !lambda 'return std::string("todo_3310/state/task/") + std::to_string(id(last_action_task)) + "/done";'
                  payload: !lambda |- 
                    bool flags[5] = {id(task_0), id(task_1), id(task_2), id(task_3), id(task_4)};
                    return flags[id(last_action_task)] ? "ON" : "OFF";
                  retain: true
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

switch:
  - platform: gpio
    name: "LED"
    id: coreink_led
    pin:
      number: ${coreink_led_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    entity_category: config

  - platform: gpio
    id: power_hold
    pin: ${coreink_pwr_mos_pin}
    restore_mode: ALWAYS_ON
    internal: true

time:
  - platform: pcf8563
    id: rtc_time
    i2c_id: bus_int
    address: 0x51
    update_interval: never
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - pcf8563.write_time