substitutions:
  name: "coreink_dev"
  hostname: coreink-todo
  friendly_name: "todo_3310"
  manufacturer: M5Stack
  model: CoreInk
  coreink_buzzer_pin: GPIO2
  coreink_led_pin: GPIO10
  coreink_battery_pin: GPIO35
  coreink_pwr_mos_pin: GPIO12
  battery_divider: "4.90"
  awake_timeout: 15s
  coreink_schedule:
    morning:
      hour: "6"
      minute: "0"
      message: "Bis morgens"
    evening:
      hour: "18"
      minute: "0"
      message: "Bis später"
  coreink_btn:
    stick:
      up:
        number: GPIO37
        inverted: true
        other_uses: false
      press:
        number: GPIO38
        inverted: true
        other_uses: false
      down:
        number: GPIO39
        inverted: true
        other_uses: false
    top:
      number: GPIO5
      inverted: true
      other_uses: false
    side:
      number: GPIO27
      inverted: true
      other_uses: true
  epaper:
    type: 1.54inv2
    rotation: 0
    cs: GPIO9
    dc: GPIO15
    busy:
      pin: GPIO4
      inverted: false
    reset: GPIO0
    full_update_every: 6

esphome:
  name: ${hostname}
  friendly_name: ${friendly_name}
  comment: "todo_3310 - generic Home Assistant/MQTT checklist with scheduled wake slots"
  platformio_options:
    upload_speed: 1500000
  on_boot:
    # Restore the CoreInk power-hold pin before releasing its deep-sleep hold.
    - priority: 900
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_12, 1);
            gpio_hold_dis(GPIO_NUM_12);
            gpio_deep_sleep_hold_dis();
    # Log the reason for a boot. GPIO wake source is the configured wake button below.
    - priority: 500
      then:
        - lambda: |- 
            const auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              ESP_LOGI("wake", "Wake reason: scheduled timer (HA-configured slots)");
            } else if (cause == ESP_SLEEP_WAKEUP_EXT0) {
              ESP_LOGI("wake", "Wake reason: SIDE button on ${coreink_btn.side.number} (EXT0)");
            } else if (cause == ESP_SLEEP_WAKEUP_EXT1) {
              ESP_LOGI("wake", "Wake reason: GPIO EXT1; check wake pin mask");
              const uint64_t mask = esp_sleep_get_ext1_wakeup_status();
              ESP_LOGI("wake", "EXT1 wake pin mask: 0x%llx", (unsigned long long) mask);
            } else if (cause == ESP_SLEEP_WAKEUP_UNDEFINED) {
              ESP_LOGI("wake", "Wake reason: normal boot/reset/power-on (USB may appear this way)");
            } else {
              ESP_LOGI("wake", "Wake reason: ESP-IDF code %d", (int) cause);
            }
    - priority: -100
      then:
        - delay: 2s
        # Only beep when a physical GPIO caused the deep-sleep wake; timer/USB boots stay silent.
        - if:
            condition:
              lambda: return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0;
            then:
              - logger.log: "Wake beep: SIDE / GPIO27"
              - rtttl.play: "wake:d=8,o=6,b=200:c"
        - lambda: |- 
            auto now = id(rtc_time).now();
            if (now.is_valid()) {
              const int day_key = now.year * 10000 + now.month * 100 + now.day_of_month;
              id(last_wakeup_daykey) = day_key;
              id(last_wakeup_hour) = now.hour;
              id(last_wakeup_minute) = now.minute;
              // Morning reset only, once per local calendar day. Evening wake keeps progress.
              const int now_minutes = now.hour * 60 + now.minute;
              const int morning_minutes = id(wake_hour_0) * 60 + id(wake_minute_0);
              if (now_minutes >= morning_minutes && id(last_reset_day) != day_key) {
                id(task_0) = false;
                id(task_1) = false;
                id(task_2) = false;
                id(task_3) = false;
                id(task_4) = false;
                id(selected_task) = 0;
                id(last_action_task) = -1;
                id(last_reset_day) = day_key;
                id(daily_reset_happened) = true;
                ESP_LOGI("tasks", "Morning reset: daily checklist cleared for %04d-%02d-%02d", now.year, now.month, now.day_of_month);
              }
            } else {
              ESP_LOGW("wake", "RTC time invalid; scheduled reset will be deferred");
            }
            // Rebuild a fixed row order once per boot/wakeup: unfinished tasks first,
            // then completed tasks, each group retaining its original task order.
            // Keep this order unchanged during the active session to avoid UI jumping.
            bool boot_done[5] = {id(task_0), id(task_1), id(task_2), id(task_3), id(task_4)};
            int boot_order[5];
            int order_count = 0;
            int first_open = -1;
            for (int i = 0; i < 5; i++) {
              if (!boot_done[i]) {
                boot_order[order_count++] = i;
                if (first_open < 0) first_open = i;
              }
            }
            for (int i = 0; i < 5; i++) if (boot_done[i]) boot_order[order_count++] = i;
            id(display_order_0) = boot_order[0];
            id(display_order_1) = boot_order[1];
            id(display_order_2) = boot_order[2];
            id(display_order_3) = boot_order[3];
            id(display_order_4) = boot_order[4];
            id(selected_task) = (first_open >= 0) ? first_open : boot_order[0];
            id(finish_card_dismissed) = false;
        # Start the short awake window before the ePaper update (which is synchronous).
        - script.execute: scheduled_sleep_cycle
        - component.update: todo_display

esp32:
  board: m5stack-coreink
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true
      flash_chip: gd

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

# MQTT is used for retained Home Assistant configuration and checklist status.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: todo_3310/device
  birth_message:
    topic: todo_3310/state/availability
    payload: online
    retain: true
  will_message:
    topic: todo_3310/state/availability
    payload: offline
    retain: true
  on_connect:
    then:
      - mqtt.publish:
          topic: todo_3310/state/availability
          payload: online
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/last_seen
          payload: !lambda |-
            auto now = id(rtc_time).now();
            char buf[32];
            if (now.is_valid()) snprintf(buf, sizeof(buf), "%04d-%02d-%02dT%02d:%02d:%02d", now.year, now.month, now.day_of_month, now.hour, now.minute, now.second);
            else snprintf(buf, sizeof(buf), "unknown");
            return std::string(buf);
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/task/0/done
          payload: !lambda 'return id(task_0) ? "ON" : "OFF";'
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/task/1/done
          payload: !lambda 'return id(task_1) ? "ON" : "OFF";'
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/task/2/done
          payload: !lambda 'return id(task_2) ? "ON" : "OFF";'
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/task/3/done
          payload: !lambda 'return id(task_3) ? "ON" : "OFF";'
          retain: true
      - mqtt.publish:
          topic: todo_3310/state/task/4/done
          payload: !lambda 'return id(task_4) ? "ON" : "OFF";'
          retain: true
  on_message:
    - topic: todo_3310/config
      then:
        - lambda: |-
            json::parse_json(x, [](JsonObject root) {
              JsonArray labels = root["labels"].as<JsonArray>();
              if (!labels.isNull()) {
                if (labels.size() > 0) id(task_label_0) = labels[0].as<std::string>();
                if (labels.size() > 1) id(task_label_1) = labels[1].as<std::string>();
                if (labels.size() > 2) id(task_label_2) = labels[2].as<std::string>();
                if (labels.size() > 3) id(task_label_3) = labels[3].as<std::string>();
                if (labels.size() > 4) id(task_label_4) = labels[4].as<std::string>();
              }
              JsonArray hours = root["hours"].as<JsonArray>();
              JsonArray minutes = root["minutes"].as<JsonArray>();
              JsonArray messages = root["messages"].as<JsonArray>();
              if (hours.size() > 0 && minutes.size() > 0) { id(wake_hour_0) = hours[0].as<int>(); id(wake_minute_0) = minutes[0].as<int>(); }
              if (hours.size() > 1 && minutes.size() > 1) { id(wake_hour_1) = hours[1].as<int>(); id(wake_minute_1) = minutes[1].as<int>(); }
              if (hours.size() > 2 && minutes.size() > 2) { id(wake_hour_2) = hours[2].as<int>(); id(wake_minute_2) = minutes[2].as<int>(); }
              if (messages.size() > 0) id(wake_message_0) = messages[0].as<std::string>();
              if (messages.size() > 1) id(wake_message_1) = messages[1].as<std::string>();
              if (messages.size() > 2) id(wake_message_2) = messages[2].as<std::string>();
              ESP_LOGI("ha_sync", "Applied Home Assistant config version %d", root["version"] | 1);
              return true;
            });
        - component.update: todo_display
        - mqtt.publish:
            topic: todo_3310/state/config_applied
            payload: "true"
            retain: true
    - topic: todo_3310/command/task/0/done
      then:
        - lambda: if (x == "ON") id(task_0) = true; else if (x == "OFF") id(task_0) = false;
        - component.update: todo_display
    - topic: todo_3310/command/task/1/done
      then:
        - lambda: if (x == "ON") id(task_1) = true; else if (x == "OFF") id(task_1) = false;
        - component.update: todo_display
    - topic: todo_3310/command/task/2/done
      then:
        - lambda: if (x == "ON") id(task_2) = true; else if (x == "OFF") id(task_2) = false;
        - component.update: todo_display
    - topic: todo_3310/command/task/3/done
      then:
        - lambda: if (x == "ON") id(task_3) = true; else if (x == "OFF") id(task_3) = false;
        - component.update: todo_display
    - topic: todo_3310/command/task/4/done
      then:
        - lambda: if (x == "ON") id(task_4) = true; else if (x == "OFF") id(task_4) = false;
        - component.update: todo_display

api:
  reboot_timeout: 0s
  encryption:
    key: !secret coreink_bathroom_todo__encryption_key

ota:
  - platform: esphome

safe_mode:
  boot_is_good_after: 15s
  num_attempts: 10

# Integrated CoreInk buzzer on GPIO2. RTTTL is used for a brief wake chirp.
# BACKLOG: add a distinctive, more-epic finish melody after the wake chirp is verified.
# BACKLOG: assign tasks to dayparts (medications in the morning; teeth morning/evening;
# lunch/solids task TBD). Teeth will likely need separate morning/evening task instances.
output:
  - platform: ledc
    pin: ${coreink_buzzer_pin}
    id: buzzer_output
    frequency: 1000Hz

rtttl:
  id: coreink_rtttl
  output: buzzer_output
  gain: 30%

# Alltagstest: konfigurierbare Morgen-/Abend-Wakeups; morgens Reset, abends Fortschritt erhalten.
# Der einzelne Wake-up-Pin wird direkt aus der zentralen Button-Definition gelesen: coreink_btn.side.
# UP/DOWN/PRESS bleiben Navigation/Listenbedienung im Wachzustand; Multi-Pin ANY_LOW bleibt geparkt.
deep_sleep:
  id: deep_sleep_battery
  # Classic ESP32: use one active-LOW RTC GPIO. Pin and polarity come from coreink_btn.side.
  wakeup_pin:
    number: ${coreink_btn.side.number}
    inverted: ${coreink_btn.side.inverted}
    allow_other_uses: ${coreink_btn.side.other_uses}
  wakeup_pin_mode: KEEP_AWAKE
  on_wake:
    then:
      - if:
          condition:
            lambda: return cause == deep_sleep::WAKEUP_CAUSE_TIMER;
          then:
            - logger.log: "Deep-sleep wake cause: scheduled timer"
      - if:
          condition:
            lambda: return cause == deep_sleep::WAKEUP_CAUSE_GPIO;
          then:
            - logger.log: "Deep-sleep wake cause: SIDE button on ${coreink_btn.side.number}"

i2c:
  - id: bus_int
    sda: GPIO21
    scl: GPIO22

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO34

