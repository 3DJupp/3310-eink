substitutions:
  name: "clock_3310"
  hostname: clock-3310
  friendly_name: "clock_3310"
  timezone: Europe/Berlin
  coreink_pwr_mos_pin: GPIO12
  epaper:
    type: 1.54inv2
    rotation: 0
    cs: GPIO9
    dc: GPIO15
    busy:
      pin: GPIO4
      inverted: false
    reset: GPIO0

esphome:
  name: ${hostname}
  friendly_name: ${friendly_name}
  comment: "clock_3310 - always-on local clock for M5Stack CoreInk"
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_12, 1);
            gpio_hold_dis(GPIO_NUM_12);
            gpio_deep_sleep_hold_dis();
    - priority: -100
      then:
        # Show the PCF8563 time right away instead of waiting for SNTP.
        - pcf8563.read_time: rtc_time
        - delay: 2s
        - component.update: clock_display

esp32:
  board: m5stack-coreink
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true
      flash_chip: gd

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 0s

# API and OTA keep the always-on clock updatable without USB.
api:
  encryption:
    key: !secret clock_3310_api_key

ota:
  - platform: esphome

i2c:
  - id: bus_int
    sda: GPIO21
    scl: GPIO22

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO34

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12
  - file: "gfonts://Roboto Mono"
    id: font_medium
    size: 20
  - file: "gfonts://Roboto Mono"
    id: font_large
    size: 34

time:
  - platform: pcf8563
    id: rtc_time
    i2c_id: bus_int
    address: 0x51
    timezone: ${timezone}
    update_interval: never
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - pcf8563.write_time:
            id: rtc_time
        - component.update: clock_display

display:
  - platform: waveshare_epaper
    id: clock_display
    model: ${epaper.type}
    update_interval: 60s
    rotation: ${epaper.rotation}
    cs_pin: ${epaper.cs}
    dc_pin: ${epaper.dc}
    reset_pin: ${epaper.reset}
    busy_pin:
      number: ${epaper.busy.pin}
      inverted: ${epaper.busy.inverted}
    full_update_every: 6
    lambda: |-
      it.fill(COLOR_OFF);
      auto now = id(rtc_time).now();
      it.filled_rectangle(0, 0, 200, 22, COLOR_ON);
      it.print(100, 4, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER, "CLOCK 3310");
      if (now.is_valid()) {
        it.printf(100, 47, id(font_large), COLOR_ON, TextAlign::TOP_CENTER, "%02d:%02d", now.hour, now.minute);
        it.printf(100, 126, id(font_small), COLOR_ON, TextAlign::TOP_CENTER, "%02d.%02d.%04d", now.day_of_month, now.month, now.year);
        const char *days[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
        it.printf(100, 148, id(font_small), COLOR_ON, TextAlign::TOP_CENTER, "%s", days[now.day_of_week % 7]);
      } else {
        it.print(100, 76, id(font_medium), COLOR_ON, TextAlign::TOP_CENTER, "TIME SYNC...");
      }
      it.line(8, 176, 192, 176, COLOR_ON);
      it.print(100, 181, id(font_small), COLOR_ON, TextAlign::TOP_CENTER, "ALWAYS ON");

# This variant intentionally has no deep_sleep component: keep it powered by USB / adapter.
