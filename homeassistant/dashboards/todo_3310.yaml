title: todo_3310
views:
  - title: Checkliste
    path: todo_3310
    icon: mdi:checklist
    cards:
      - type: entities
        title: CoreInk Status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.todo_3310_online
            name: Online (MQTT)
          - entity: sensor.todo_3310_akkuspannung_mqtt
            name: Akkuspannung
          - entity: sensor.todo_3310_akkustand_mqtt
            name: Akkustand
          - entity: sensor.todo_3310_letzter_kontakt
            name: Letzter Kontakt
          - entity: sensor.todo_3310_sekunden_bis_wakeup
            name: Sekunden bis zum nächsten Wakeup (letzte Berechnung)
          - entity: input_boolean.todo_3310_config_pending
            name: Konfiguration wird gesendet
      - type: entities
        title: Aufgaben – Beschriftungen und Status
        show_header_toggle: false
        entities:
          - entity: input_text.todo_3310_task_0_label
          - entity: input_boolean.todo_3310_task_0_done
          - entity: input_text.todo_3310_task_1_label
          - entity: input_boolean.todo_3310_task_1_done
          - entity: input_text.todo_3310_task_2_label
          - entity: input_boolean.todo_3310_task_2_done
          - entity: input_text.todo_3310_task_3_label
          - entity: input_boolean.todo_3310_task_3_done
          - entity: input_text.todo_3310_task_4_label
          - entity: input_boolean.todo_3310_task_4_done
      - type: entities
        title: Wakeup-Zeiten und Display-Nachrichten
        show_header_toggle: false
        entities:
          - entity: input_datetime.todo_3310_wake_0
          - entity: input_text.todo_3310_wake_0_message
          - entity: input_datetime.todo_3310_wake_1
          - entity: input_text.todo_3310_wake_1_message
          - entity: input_datetime.todo_3310_wake_2
          - entity: input_text.todo_3310_wake_2_message
      - type: markdown
        title: Hinweise
        content: >-
          Änderungen werden als retained MQTT-Konfiguration gespeichert und beim nächsten
          CoreInk-Aufwachen übernommen. Online/Offline zeigt den MQTT-Zustand, nicht
          dauerhafte Erreichbarkeit. Firmware-Updates erfolgen weiterhin über ESPHome OTA.
