# todo_3310 - example dashboard view. This file is ONE view, not a whole dashboard.
# Settings -> Dashboards -> open (or create) a dashboard -> pencil -> add a view or edit
# an existing one -> three dots -> Edit in YAML -> replace everything with this file.
# Uses only built-in cards. Needs the package and the three Local To-do lists described in
# homeassistant/packages/todo_3310.yaml.
title: Checklist
path: todo_3310
# Built-in Material Design Icon. With the Material Symbols custom integration (HACS)
# installed, m3of:checklist-rtl works too.
icon: mdi:format-list-checks
type: sections
max_columns: 4
badges:
  - type: entity
    entity: sensor.todo_3310_active_list
    name: On screen
    show_name: true
  - type: entity
    entity: binary_sensor.todo_3310_online
    name: CoreInk
    show_name: true
  - type: entity
    entity: sensor.todo_3310_battery_mqtt
    name: Battery
    show_name: true
  - type: entity
    entity: input_boolean.todo_3310_config_pending
    name: Sending
    show_name: true
    visibility:
      - condition: state
        entity: input_boolean.todo_3310_config_pending
        state: "on"
sections:
  - type: grid
    cards:
      - type: heading
        heading: Morning
        icon: mdi:weather-sunset-up
        badges:
          - type: entity
            entity: input_datetime.todo_3310_wake_0
            show_icon: false
            show_state: true
      - type: todo-list
        entity: todo.todo_3310_morning
        display_order: manual

  - type: grid
    cards:
      - type: heading
        heading: Midday
        icon: mdi:white-balance-sunny
        badges:
          - type: entity
            entity: input_datetime.todo_3310_wake_1
            show_icon: false
            show_state: true
      - type: todo-list
        entity: todo.todo_3310_midday
        display_order: manual

  - type: grid
    cards:
      - type: heading
        heading: Evening
        icon: mdi:weather-night
        badges:
          - type: entity
            entity: input_datetime.todo_3310_wake_2
            show_icon: false
            show_state: true
      - type: todo-list
        entity: todo.todo_3310_evening
        display_order: manual

  - type: grid
    cards:
      - type: heading
        heading: CoreInk
        icon: mdi:tablet
      - type: tile
        entity: binary_sensor.todo_3310_online
        name: MQTT
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.todo_3310_battery_mqtt
        name: Battery
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.todo_3310_battery_voltage_mqtt
        name: Voltage
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.todo_3310_wake_reason
        name: Last wake
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.todo_3310_last_seen
        name: Last seen
        grid_options: {columns: 6}
      - type: tile
        entity: sensor.todo_3310_next_wakeup
        name: Next wakeup
        grid_options: {columns: 6}
      # Battery drain over a week. With the power-off on battery the voltage should stay
      # almost flat overnight; a steady slope between wakes means the board stayed on.
      - type: history-graph
        title: Battery, last 7 days
        hours_to_show: 168
        entities:
          - entity: sensor.todo_3310_battery_voltage_mqtt
            name: Voltage

  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Schedule, texts and language
        icon: mdi:calendar-clock
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_select.todo_3310_language
            name: Display language
          - type: section
            label: Morning
          - entity: input_datetime.todo_3310_wake_0
            name: Start
          - entity: input_text.todo_3310_slot_0_title
            name: Title on screen
          - entity: input_text.todo_3310_wake_0_message
            name: Message when done
          - type: section
            label: Midday
          - entity: input_datetime.todo_3310_wake_1
            name: Start
          - entity: input_text.todo_3310_slot_1_title
            name: Title on screen
          - entity: input_text.todo_3310_wake_1_message
            name: Message when done
          - type: section
            label: Evening
          - entity: input_datetime.todo_3310_wake_2
            name: Start
          - entity: input_text.todo_3310_slot_2_title
            name: Title on screen
          - entity: input_text.todo_3310_wake_2_message
            name: Message when done

  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: How it syncs
        heading_style: subtitle
      - type: markdown
        content: >-
          The CoreInk shows the **first five items** of the list whose daypart is
          active. All three lists are reset once a day, when the first daypart starts.
          Between dayparts the device switches itself off and its clock switches it
          back on about a minute after the next start, so changes made here reach it
          then or when someone presses the side button. Once the last task is
          checked, the device shows its "message when done" for a few seconds and
          goes back to sleep, so write that message in the language the device is
          used in.
