title: todo_3310
views:
  - title: Checklist
    path: todo_3310
    icon: mdi:checklist
    cards:
      - type: entities
        title: CoreInk Status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.todo_3310_online
            name: Online (MQTT)
          - entity: sensor.todo_3310_battery_voltage_mqtt
            name: Battery voltage
          - entity: sensor.todo_3310_battery_mqtt
            name: Battery
          - entity: sensor.todo_3310_last_seen
            name: Last seen
          - entity: sensor.todo_3310_seconds_to_wakeup
            name: Seconds to next wakeup (last calculation)
          - entity: input_boolean.todo_3310_config_pending
            name: Sending config
      - type: entities
        title: Tasks – labels and state
        show_header_toggle: false
        entities:
          - entity: input_text.todo_3310_task_0_label
          - entity: input_boolean.todo_3310_task_0_done
          - entity: input_text.todo_3310_task_1_label
          - entity: input_boolean.todo_3310_task_1_done
          - entity: input_text.todo_3310_task_2_label
          - entity: input_boolean.todo_3310_task_2_done
          - entity: input_text.todo_3310_task_3_label
          - entity: input_boolean.todo_3310_task_3_done
          - entity: input_text.todo_3310_task_4_label
          - entity: input_boolean.todo_3310_task_4_done
      - type: entities
        title: Wakeup times and display messages
        show_header_toggle: false
        entities:
          - entity: input_datetime.todo_3310_wake_0
          - entity: input_text.todo_3310_wake_0_message
          - entity: input_datetime.todo_3310_wake_1
          - entity: input_text.todo_3310_wake_1_message
          - entity: input_datetime.todo_3310_wake_2
          - entity: input_text.todo_3310_wake_2_message
      - type: markdown
        title: Notes
        content: >-
          Changes are stored as retained MQTT config and applied on the next CoreInk
          wakeup. Online/offline shows the MQTT state, not permanent reachability.
          Firmware updates still go through ESPHome OTA.
