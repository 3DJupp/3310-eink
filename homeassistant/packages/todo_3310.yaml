# todo_3310 - Home Assistant package
# Copy to config/packages/todo_3310.yaml and enable packages in configuration.yaml.
#
# Tasks live in three Home Assistant to-do lists, one per daypart. Create them once in
# Settings -> Devices & services -> Add integration -> "Local To-do" with these names:
#   todo_3310 Morning  -> todo.todo_3310_morning
#   todo_3310 Midday   -> todo.todo_3310_midday
#   todo_3310 Evening  -> todo.todo_3310_evening
# The first five items of each list are shown on the CoreInk during that daypart.

# No "initial:" on these helpers: HA would reset them to it on every restart. Fresh
# installs get their defaults once from the "Set defaults" automation below.
input_text:
  todo_3310_slot_0_title: {name: "todo_3310 Morning title", max: 14}
  todo_3310_slot_1_title: {name: "todo_3310 Midday title", max: 14}
  todo_3310_slot_2_title: {name: "todo_3310 Evening title", max: 14}
  # Shown on the finish card when that daypart's list is done.
  todo_3310_wake_0_message: {name: "todo_3310 Morning message", max: 32}
  todo_3310_wake_1_message: {name: "todo_3310 Midday message", max: 32}
  todo_3310_wake_2_message: {name: "todo_3310 Evening message", max: 32}

# Language of the fixed texts on the CoreInk (finish card, footer, battery warnings).
input_select:
  todo_3310_language:
    name: "todo_3310 Display language"
    icon: mdi:translate
    options:
      - "Deutsch"
      - "English"

input_boolean:
  todo_3310_config_pending:
    name: "todo_3310 Config pending"
    icon: mdi:cloud-upload-outline

input_datetime:
  todo_3310_wake_0: {name: "todo_3310 Morning start", has_date: false, has_time: true}
  todo_3310_wake_1: {name: "todo_3310 Midday start", has_date: false, has_time: true}
  todo_3310_wake_2: {name: "todo_3310 Evening start", has_date: false, has_time: true}

mqtt:
  sensor:
    - name: "todo_3310 Battery Voltage MQTT"
      unique_id: todo_3310_mqtt_battery_voltage
      state_topic: todo_3310/state/battery_voltage
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    - name: "todo_3310 Battery MQTT"
      unique_id: todo_3310_mqtt_battery_percent
      state_topic: todo_3310/state/battery_percent
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
    - name: "todo_3310 Last Seen"
      unique_id: todo_3310_mqtt_last_seen
      state_topic: todo_3310/state/last_seen
      icon: mdi:clock-check-outline
    - name: "todo_3310 Seconds To Wakeup"
      unique_id: todo_3310_mqtt_seconds_to_wakeup
      state_topic: todo_3310/state/seconds_to_wakeup
      unit_of_measurement: s
      state_class: measurement
      icon: mdi:sleep
  binary_sensor:
    - name: "todo_3310 Online"
      unique_id: todo_3310_mqtt_availability
      state_topic: todo_3310/state/availability
      payload_on: online
      payload_off: offline
      device_class: connectivity
      off_delay: 90

template:
  - sensor:
      # Which daypart list the CoreInk shows right now, derived from the three start times.
      - name: "todo_3310 Active list"
        unique_id: todo_3310_active_list
        icon: mdi:calendar-clock
        state: >-
          {% set n = now().hour * 60 + now().minute %}
          {% set ns = namespace(active=-1, best=-1, latest=0, latest_m=-1) %}
          {% for i in range(3) %}
            {% set t = states('input_datetime.todo_3310_wake_' ~ i) %}
            {% set m = t[0:2] | int(0) * 60 + t[3:5] | int(0) %}
            {% if m <= n and m > ns.best %}{% set ns.active = i %}{% set ns.best = m %}{% endif %}
            {% if m > ns.latest_m %}{% set ns.latest = i %}{% set ns.latest_m = m %}{% endif %}
          {% endfor %}
          {% set slot = ns.active if ns.active >= 0 else ns.latest %}
          {{ states('input_text.todo_3310_slot_' ~ slot ~ '_title') }}

script:
  # Labels, titles, start times and messages for all three dayparts as one retained message.
  todo_3310_publish_config:
    alias: "todo_3310 - Publish config"
    mode: queued
    sequence:
      - action: todo.get_items
        target:
          entity_id: [todo.todo_3310_morning, todo.todo_3310_midday, todo.todo_3310_evening]
        data:
          status: [needs_action, completed]
        response_variable: lists
      - action: mqtt.publish
        data:
          topic: todo_3310/config
          retain: true
          qos: 1
          payload: >-
            {% set ids = ['todo.todo_3310_morning', 'todo.todo_3310_midday', 'todo.todo_3310_evening'] %}
            {% set ns = namespace(slots=[]) %}
            {% for i in range(3) %}
              {% set items = (lists[ids[i]]['items'] if ids[i] in lists else [])[:5] %}
              {% set t = states('input_datetime.todo_3310_wake_' ~ i) %}
              {% set ns.slots = ns.slots + [{
                'title': states('input_text.todo_3310_slot_' ~ i ~ '_title'),
                'hour': t[0:2] | int([6, 12, 18][i]),
                'minute': t[3:5] | int(0),
                'message': states('input_text.todo_3310_wake_' ~ i ~ '_message'),
                'tasks': items | map(attribute='summary') | map('truncate', 32, true, '', 0) | list
              }] %}
            {% endfor %}
            {{ {'version': 2,
                'language': 'en' if is_state('input_select.todo_3310_language', 'English') else 'de',
                'slots': ns.slots} | tojson }}

  # Done states of one list, sent after a change in HA. The CoreInk applies it on its next
  # wake by label name and then clears the retained message.
  todo_3310_push_list:
    alias: "todo_3310 - Push list state to CoreInk"
    mode: queued
    fields:
      slot:
        description: "Daypart index 0..2"
        example: 0
    sequence:
      - variables:
          entity: "{{ ['todo.todo_3310_morning', 'todo.todo_3310_midday', 'todo.todo_3310_evening'][slot | int] }}"
      - action: todo.get_items
        target: {entity_id: "{{ entity }}"}
        data:
          status: [needs_action, completed]
        response_variable: lists
      - variables:
          items: "{{ lists[entity]['items'][:5] if entity in lists else [] }}"
      - action: mqtt.publish
        data:
          topic: "todo_3310/command/slot/{{ slot | int }}"
          retain: true
          qos: 1
          payload: >-
            {% set ns = namespace(labels=[], done=[]) %}
            {% for item in items %}
              {% set ns.labels = ns.labels + [item.summary | truncate(32, true, '', 0)] %}
              {% set ns.done = ns.done + [item.status == 'completed'] %}
            {% endfor %}
            {{ {'labels': ns.labels, 'done': ns.done} | tojson }}

automation:
  # One-time defaults for a fresh install (German texts, 06:00 / 12:00 / 18:00).
  # Runs only while the morning title is still empty, so later edits are kept.
  - id: todo_3310_set_defaults
    alias: "todo_3310 - Set defaults on first start"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('input_text.todo_3310_slot_0_title') in ['', 'unknown'] }}"
    actions:
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.todo_3310_wake_0}
        data: {time: "06:00:00"}
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.todo_3310_wake_1}
        data: {time: "12:00:00"}
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.todo_3310_wake_2}
        data: {time: "18:00:00"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_slot_0_title}
        data: {value: "Morgens"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_slot_1_title}
        data: {value: "Mittags"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_slot_2_title}
        data: {value: "Abends"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_wake_0_message}
        data: {value: "Schönen Tag!"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_wake_1_message}
        data: {value: "Schönen Nachmittag!"}
      - action: input_text.set_value
        target: {entity_id: input_text.todo_3310_wake_2_message}
        data: {value: "Bis morgen!"}

  - id: todo_3310_publish_config
    alias: "todo_3310 - Send config to CoreInk"
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - todo.todo_3310_morning
          - todo.todo_3310_midday
          - todo.todo_3310_evening
          - input_text.todo_3310_slot_0_title
          - input_text.todo_3310_slot_1_title
          - input_text.todo_3310_slot_2_title
          - input_text.todo_3310_wake_0_message
          - input_text.todo_3310_wake_1_message
          - input_text.todo_3310_wake_2_message
          - input_datetime.todo_3310_wake_0
          - input_datetime.todo_3310_wake_1
          - input_datetime.todo_3310_wake_2
          - input_select.todo_3310_language
      # Renaming or reordering items does not change a to-do entity's state, so also
      # refresh regularly. The CoreInk ignores a config that did not change.
      - trigger: time_pattern
        minutes: "/10"
    actions:
      - delay: "00:00:02"
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.todo_3310_config_pending}
      - action: script.todo_3310_publish_config
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.todo_3310_config_pending}

  # Only changes made by a person (dashboard, app, voice) are pushed. Changes written by
  # the automations below come from the device or the daily reset and must not echo back.
  - id: todo_3310_push_user_changes
    alias: "todo_3310 - Send list changes to CoreInk"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - todo.todo_3310_morning
          - todo.todo_3310_midday
          - todo.todo_3310_evening
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    actions:
      - delay: "00:00:02"
      - action: script.todo_3310_push_list
        data:
          slot: "{{ ['todo.todo_3310_morning', 'todo.todo_3310_midday', 'todo.todo_3310_evening'].index(trigger.entity_id) }}"

  - id: todo_3310_receive_list_state
    alias: "todo_3310 - Apply CoreInk list state"
    mode: queued
    triggers:
      - trigger: mqtt
        topic: "todo_3310/state/slot/+"
    variables:
      slot: "{{ trigger.topic.split('/')[-1] | int(-1) }}"
      entity: "{{ ['todo.todo_3310_morning', 'todo.todo_3310_midday', 'todo.todo_3310_evening'][slot] if 0 <= slot <= 2 else '' }}"
      device_labels: "{{ trigger.payload_json.labels | default([]) }}"
      device_done: "{{ trigger.payload_json.done | default([]) }}"
    conditions:
      - condition: template
        value_template: "{{ entity != '' and device_labels | count > 0 }}"
    actions:
      - action: todo.get_items
        target: {entity_id: "{{ entity }}"}
        data:
          status: [needs_action, completed]
        response_variable: lists
      - repeat:
          for_each: "{{ lists[entity]['items'][:5] if entity in lists else [] }}"
          sequence:
            - variables:
                label: "{{ repeat.item.summary | truncate(32, true, '', 0) }}"
                wanted: >-
                  {%- if label in device_labels -%}
                    {{ 'completed' if device_done[device_labels.index(label)] else 'needs_action' }}
                  {%- else -%}{{ repeat.item.status }}{%- endif -%}
            - if:
                - condition: template
                  value_template: "{{ wanted != repeat.item.status }}"
              then:
                - action: todo.update_item
                  target: {entity_id: "{{ entity }}"}
                  data:
                    item: "{{ repeat.item.uid }}"
                    status: "{{ wanted }}"

  # The CoreInk resets the active daypart list on its own when it wakes; mirror that here
  # and drop any unapplied command for the list so it cannot re-check yesterday's tasks.
  - id: todo_3310_daypart_reset
    alias: "todo_3310 - Reset list at daypart start"
    mode: queued
    triggers:
      - trigger: time
        at: input_datetime.todo_3310_wake_0
        id: "0"
      - trigger: time
        at: input_datetime.todo_3310_wake_1
        id: "1"
      - trigger: time
        at: input_datetime.todo_3310_wake_2
        id: "2"
    variables:
      entity: "{{ ['todo.todo_3310_morning', 'todo.todo_3310_midday', 'todo.todo_3310_evening'][trigger.id | int] }}"
    actions:
      - action: mqtt.publish
        data:
          topic: "todo_3310/command/slot/{{ trigger.id }}"
          payload: ""
          retain: true
      - action: todo.get_items
        target: {entity_id: "{{ entity }}"}
        data:
          status: completed
        response_variable: lists
      - repeat:
          for_each: "{{ lists[entity]['items'] if entity in lists else [] }}"
          sequence:
            - action: todo.update_item
              target: {entity_id: "{{ entity }}"}
              data:
                item: "{{ repeat.item.uid }}"
                status: needs_action
