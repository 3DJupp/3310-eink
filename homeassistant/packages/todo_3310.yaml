# todo_3310 - Home Assistant package
# Copy to config/packages/todo_3310.yaml and enable packages in configuration.yaml.
input_text:
  todo_3310_task_0_label: {name: "todo_3310 Task 1", initial: "Water plants", max: 32}
  todo_3310_task_1_label: {name: "todo_3310 Task 2", initial: "Get the mail", max: 32}
  todo_3310_task_2_label: {name: "todo_3310 Task 3", initial: "Hang up laundry", max: 32}
  todo_3310_task_3_label: {name: "todo_3310 Task 4", initial: "Tidy the kitchen", max: 32}
  todo_3310_task_4_label: {name: "todo_3310 Task 5", initial: "Read", max: 32}
  todo_3310_wake_0_message: {name: "todo_3310 Morning message", initial: "Good morning", max: 32}
  todo_3310_wake_1_message: {name: "todo_3310 Midday message", initial: "Lunchtime", max: 32}
  todo_3310_wake_2_message: {name: "todo_3310 Evening message", initial: "See you later", max: 32}

input_boolean:
  todo_3310_task_0_done: {name: "todo_3310 Task 1 done"}
  todo_3310_task_1_done: {name: "todo_3310 Task 2 done"}
  todo_3310_task_2_done: {name: "todo_3310 Task 3 done"}
  todo_3310_task_3_done: {name: "todo_3310 Task 4 done"}
  todo_3310_task_4_done: {name: "todo_3310 Task 5 done"}
  todo_3310_config_pending:
    name: "todo_3310 Config pending"
    icon: mdi:cloud-upload-outline

input_datetime:
  todo_3310_wake_0: {name: "todo_3310 Morning wakeup", has_date: false, has_time: true, initial: "06:00:00"}
  todo_3310_wake_1: {name: "todo_3310 Midday wakeup", has_date: false, has_time: true, initial: "12:00:00"}
  todo_3310_wake_2: {name: "todo_3310 Evening wakeup", has_date: false, has_time: true, initial: "18:00:00"}

mqtt:
  sensor:
    - name: "todo_3310 Battery Voltage MQTT"
      unique_id: todo_3310_mqtt_battery_voltage
      state_topic: todo_3310/state/battery_voltage
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    - name: "todo_3310 Battery MQTT"
      unique_id: todo_3310_mqtt_battery_percent
      state_topic: todo_3310/state/battery_percent
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
    - name: "todo_3310 Last Seen"
      unique_id: todo_3310_mqtt_last_seen
      state_topic: todo_3310/state/last_seen
    - name: "todo_3310 Seconds To Wakeup"
      unique_id: todo_3310_mqtt_seconds_to_wakeup
      state_topic: todo_3310/state/seconds_to_wakeup
      unit_of_measurement: s
      state_class: measurement
  binary_sensor:
    - name: "todo_3310 Online"
      unique_id: todo_3310_mqtt_availability
      state_topic: todo_3310/state/availability
      payload_on: online
      payload_off: offline
      device_class: connectivity
      off_delay: 90

automation:
  - id: todo_3310_publish_config
    alias: "todo_3310 - Send config to CoreInk"
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_text.todo_3310_task_0_label
          - input_text.todo_3310_task_1_label
          - input_text.todo_3310_task_2_label
          - input_text.todo_3310_task_3_label
          - input_text.todo_3310_task_4_label
          - input_text.todo_3310_wake_0_message
          - input_text.todo_3310_wake_1_message
          - input_text.todo_3310_wake_2_message
          - input_datetime.todo_3310_wake_0
          - input_datetime.todo_3310_wake_1
          - input_datetime.todo_3310_wake_2
    action:
      - service: input_boolean.turn_on
        target: {entity_id: input_boolean.todo_3310_config_pending}
      - service: mqtt.publish
        data:
          topic: todo_3310/config
          retain: true
          qos: 1
          payload: >-
            {{ {'version': 1,
              'labels': [states('input_text.todo_3310_task_0_label'), states('input_text.todo_3310_task_1_label'), states('input_text.todo_3310_task_2_label'), states('input_text.todo_3310_task_3_label'), states('input_text.todo_3310_task_4_label')],
              'hours': [states('input_datetime.todo_3310_wake_0')[0:2]|int(6), states('input_datetime.todo_3310_wake_1')[0:2]|int(12), states('input_datetime.todo_3310_wake_2')[0:2]|int(18)],
              'minutes': [states('input_datetime.todo_3310_wake_0')[3:5]|int(0), states('input_datetime.todo_3310_wake_1')[3:5]|int(0), states('input_datetime.todo_3310_wake_2')[3:5]|int(0)],
              'messages': [states('input_text.todo_3310_wake_0_message'), states('input_text.todo_3310_wake_1_message'), states('input_text.todo_3310_wake_2_message')] } | tojson }}
      - delay: "00:00:02"
      - service: input_boolean.turn_off
        target: {entity_id: input_boolean.todo_3310_config_pending}

  - id: todo_3310_daily_reset
    alias: "todo_3310 - Reset daily state in the morning"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.todo_3310_wake_0
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.todo_3310_task_0_done
            - input_boolean.todo_3310_task_1_done
            - input_boolean.todo_3310_task_2_done
            - input_boolean.todo_3310_task_3_done
            - input_boolean.todo_3310_task_4_done

  - id: todo_3310_publish_manual_task_state
    alias: "todo_3310 - Send HA task state to CoreInk"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - input_boolean.todo_3310_task_0_done
          - input_boolean.todo_3310_task_1_done
          - input_boolean.todo_3310_task_2_done
          - input_boolean.todo_3310_task_3_done
          - input_boolean.todo_3310_task_4_done
    variables:
      slot: "{{ {'input_boolean.todo_3310_task_0_done': 0, 'input_boolean.todo_3310_task_1_done': 1, 'input_boolean.todo_3310_task_2_done': 2, 'input_boolean.todo_3310_task_3_done': 3, 'input_boolean.todo_3310_task_4_done': 4}.get(trigger.entity_id, -1) }}"
      payload_value: "{{ 'ON' if trigger.to_state.state == 'on' else 'OFF' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "{{ 'todo_3310/command/task/' ~ slot ~ '/done' }}"
          payload: "{{ payload_value }}"
          retain: true
          qos: 1

  - id: todo_3310_receive_task_state
    alias: "todo_3310 - Apply device task state"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "todo_3310/state/task/+/done"
    variables:
      slot: "{{ trigger.topic.split('/')[3] | int(-1) }}"
      is_done: "{{ trigger.payload == 'ON' }}"
    action:
      - choose:
          - conditions: "{{ slot == 0 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.todo_3310_task_0_done}
          - conditions: "{{ slot == 1 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.todo_3310_task_1_done}
          - conditions: "{{ slot == 2 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.todo_3310_task_2_done}
          - conditions: "{{ slot == 3 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.todo_3310_task_3_done}
          - conditions: "{{ slot == 4 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.todo_3310_task_4_done}
