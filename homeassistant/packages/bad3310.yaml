# BAD 3310 - Home Assistant package
# Copy to config/packages/bad3310.yaml and enable packages in configuration.yaml.
input_text:
  bad3310_task_0_label: {name: "BAD 3310 Aufgabe 1", initial: "Vitamin D", max: 32}
  bad3310_task_1_label: {name: "BAD 3310 Aufgabe 2", initial: "Jod", max: 32}
  bad3310_task_2_label: {name: "BAD 3310 Aufgabe 3", initial: "Omega 3", max: 32}
  bad3310_task_3_label: {name: "BAD 3310 Aufgabe 4", initial: "Zähneputzen", max: 32}
  bad3310_task_4_label: {name: "BAD 3310 Aufgabe 5", initial: "Babyspa", max: 32}
  bad3310_wake_0_message: {name: "BAD 3310 Morgen-Nachricht", initial: "Guten Morgen", max: 32}
  bad3310_wake_1_message: {name: "BAD 3310 Mittags-Nachricht", initial: "Mittagszeit", max: 32}
  bad3310_wake_2_message: {name: "BAD 3310 Abend-Nachricht", initial: "Bis später", max: 32}

input_boolean:
  bad3310_task_0_done: {name: "Vitamin D erledigt"}
  bad3310_task_1_done: {name: "Jod erledigt"}
  bad3310_task_2_done: {name: "Omega 3 erledigt"}
  bad3310_task_3_done: {name: "Zähneputzen erledigt"}
  bad3310_task_4_done: {name: "Babyspa erledigt"}
  bad3310_config_pending:
    name: "BAD 3310 Konfiguration ausstehend"
    icon: mdi:cloud-upload-outline

input_datetime:
  bad3310_wake_0: {name: "BAD 3310 Morgen-Wakeup", has_date: false, has_time: true, initial: "06:00:00"}
  bad3310_wake_1: {name: "BAD 3310 Mittags-Wakeup", has_date: false, has_time: true, initial: "12:00:00"}
  bad3310_wake_2: {name: "BAD 3310 Abend-Wakeup", has_date: false, has_time: true, initial: "18:00:00"}

mqtt:
  sensor:
    - name: "BAD 3310 Akkuspannung MQTT"
      unique_id: bad3310_mqtt_battery_voltage
      state_topic: bad3310/state/battery_voltage
      unit_of_measurement: V
      device_class: voltage
      state_class: measurement
    - name: "BAD 3310 Akkustand MQTT"
      unique_id: bad3310_mqtt_battery_percent
      state_topic: bad3310/state/battery_percent
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
    - name: "BAD 3310 Letzter Kontakt"
      unique_id: bad3310_mqtt_last_seen
      state_topic: bad3310/state/last_seen
    - name: "BAD 3310 Sekunden bis Wakeup"
      unique_id: bad3310_mqtt_seconds_to_wakeup
      state_topic: bad3310/state/seconds_to_wakeup
      unit_of_measurement: s
      state_class: measurement
  binary_sensor:
    - name: "BAD 3310 Online"
      unique_id: bad3310_mqtt_availability
      state_topic: bad3310/state/availability
      payload_on: online
      payload_off: offline
      device_class: connectivity
      off_delay: 90

automation:
  - id: bad3310_publish_config
    alias: "BAD 3310 - Konfiguration an CoreInk senden"
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_text.bad3310_task_0_label
          - input_text.bad3310_task_1_label
          - input_text.bad3310_task_2_label
          - input_text.bad3310_task_3_label
          - input_text.bad3310_task_4_label
          - input_text.bad3310_wake_0_message
          - input_text.bad3310_wake_1_message
          - input_text.bad3310_wake_2_message
          - input_datetime.bad3310_wake_0
          - input_datetime.bad3310_wake_1
          - input_datetime.bad3310_wake_2
    action:
      - service: input_boolean.turn_on
        target: {entity_id: input_boolean.bad3310_config_pending}
      - service: mqtt.publish
        data:
          topic: bad3310/config
          retain: true
          qos: 1
          payload: >-
            {{ {'version': 1,
              'labels': [states('input_text.bad3310_task_0_label'), states('input_text.bad3310_task_1_label'), states('input_text.bad3310_task_2_label'), states('input_text.bad3310_task_3_label'), states('input_text.bad3310_task_4_label')],
              'hours': [states('input_datetime.bad3310_wake_0')[0:2]|int(6), states('input_datetime.bad3310_wake_1')[0:2]|int(12), states('input_datetime.bad3310_wake_2')[0:2]|int(18)],
              'minutes': [states('input_datetime.bad3310_wake_0')[3:5]|int(0), states('input_datetime.bad3310_wake_1')[3:5]|int(0), states('input_datetime.bad3310_wake_2')[3:5]|int(0)],
              'messages': [states('input_text.bad3310_wake_0_message'), states('input_text.bad3310_wake_1_message'), states('input_text.bad3310_wake_2_message')] } | tojson }}
      - delay: "00:00:02"
      - service: input_boolean.turn_off
        target: {entity_id: input_boolean.bad3310_config_pending}

  - id: bad3310_daily_reset
    alias: "BAD 3310 - Tagesstatus morgens zurücksetzen"
    mode: single
    trigger:
      - platform: time
        at: input_datetime.bad3310_wake_0
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.bad3310_task_0_done
            - input_boolean.bad3310_task_1_done
            - input_boolean.bad3310_task_2_done
            - input_boolean.bad3310_task_3_done
            - input_boolean.bad3310_task_4_done

  - id: bad3310_publish_manual_task_state
    alias: "BAD 3310 - HA-Aufgabenstatus an CoreInk senden"
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - input_boolean.bad3310_task_0_done
          - input_boolean.bad3310_task_1_done
          - input_boolean.bad3310_task_2_done
          - input_boolean.bad3310_task_3_done
          - input_boolean.bad3310_task_4_done
    variables:
      slot: "{{ {'input_boolean.bad3310_task_0_done': 0, 'input_boolean.bad3310_task_1_done': 1, 'input_boolean.bad3310_task_2_done': 2, 'input_boolean.bad3310_task_3_done': 3, 'input_boolean.bad3310_task_4_done': 4}.get(trigger.entity_id, -1) }}"
      payload_value: "{{ 'ON' if trigger.to_state.state == 'on' else 'OFF' }}"
    action:
      - service: mqtt.publish
        data:
          topic: "{{ 'bad3310/command/task/' ~ slot ~ '/done' }}"
          payload: "{{ payload_value }}"
          retain: true
          qos: 1

  - id: bad3310_receive_task_state
    alias: "BAD 3310 - Gerätestatus übernehmen"
    mode: queued
    trigger:
      - platform: mqtt
        topic: "bad3310/state/task/+/done"
    variables:
      slot: "{{ trigger.topic.split('/')[3] | int(-1) }}"
      is_done: "{{ trigger.payload == 'ON' }}"
    action:
      - choose:
          - conditions: "{{ slot == 0 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.bad3310_task_0_done}
          - conditions: "{{ slot == 1 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.bad3310_task_1_done}
          - conditions: "{{ slot == 2 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.bad3310_task_2_done}
          - conditions: "{{ slot == 3 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.bad3310_task_3_done}
          - conditions: "{{ slot == 4 }}"
            sequence:
              - service: "input_boolean.turn_{{ 'on' if is_done else 'off' }}"
                target: {entity_id: input_boolean.bad3310_task_4_done}
